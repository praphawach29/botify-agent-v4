// ═══════════════════════════════════════════════════════════
//  💬 CHAT HISTORY — ประวัติแชทลูกค้า
// ═══════════════════════════════════════════════════════════
function ChatHistoryPage({ toast }) {
  const [users, setUsers] = useState([]);
  const [selectedUser, setSelectedUser] = useState(null);
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadingMsgs, setLoadingMsgs] = useState(false);
  const [search, setSearch] = useState("");
  const [platformFilter, setPlatformFilter] = useState("all");

  // โหลดรายชื่อผู้ใช้ที่เคยแชท
  const loadUsers = useCallback(() => {
    api("/api/chats/users").then(r => {
      if (r.users) setUsers(r.users);
    }).catch(() => {}).finally(() => setLoading(false));
  }, []);

  useEffect(() => { loadUsers(); }, [loadUsers]);

  // โหลดแชทของ user ที่เลือกซ้ำ (เพื่อใช้กับ realtime)
  const refreshCurrentChat = useCallback(() => {
    setSelectedUser(prev => {
      if (prev && prev.userId && prev.platform) {
        api(`/api/chats/${encodeURIComponent(prev.userId)}?platform=${prev.platform}&limit=100`)
          .then(r => { if (r.messages) setMessages(r.messages); })
          .catch(() => {});
      }
      return prev;
    });
  }, []);

  // Supabase Realtime Subscription
  useEffect(() => {
    let channel = null;
    const shopId = sessionStorage.getItem("botify_shop_id");
    
    RealtimeManager.init().then(client => {
      if (!client) return;
      channel = client.channel('dashboard-chats')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_logs' }, payload => {
          if (shopId && payload.new && payload.new.workspace_id && payload.new.workspace_id !== shopId) return;
          loadUsers();
          refreshCurrentChat();
        })
        .subscribe();
    });

    return () => {
      if (channel) {
        RealtimeManager.init().then(client => client && client.removeChannel(channel));
      }
    };
  }, [loadUsers, refreshCurrentChat]);

  // โหลดแชทของ user ที่เลือก
  const loadChat = async (userId, platform) => {
    setSelectedUser({ userId, platform });
    setLoadingMsgs(true);
    try {
      const r = await api(`/api/chats/${encodeURIComponent(userId)}?platform=${platform}&limit=100`);
      if (r.messages) setMessages(r.messages);
    } catch {}
    setLoadingMsgs(false);
  };

  const filteredUsers = users.filter(u => {
    if (platformFilter !== "all" && u.platform !== platformFilter) return false;
    if (search && !u.user_id.includes(search) && !(u.user_name || "").includes(search)) return false;
    return true;
  });

  const formatTime = (ts) => {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleString("th-TH", { timeZone: "Asia/Bangkok", hour: "2-digit", minute: "2-digit", day: "2-digit", month: "short" });
  };

  if (loading) return <div className="flex justify-center py-20"><div className="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin" /></div>;

  return (
    <div>
      <div className="flex items-center justify-between gap-3 mb-6">
        <div className="flex flex-col">
          <h1 className="text-base md:text-xl font-black text-slate-900 leading-tight whitespace-nowrap">ประวัติแชทลูกค้า</h1>
          <p className="text-[10px] text-gray-400 leading-none mt-0.5 hidden sm:block">ดูประวัติรายการสนทนาและการตอบกลับย้อนหลังของบอทกับลูกค้า</p>
        </div>
      </div>
      <div className="flex flex-col lg:flex-row gap-4" style={{minHeight:"60vh"}}>
        {/* Left: User List */}
        <div className="w-full lg:w-80 bg-white rounded-xl border border-gray-200/50 flex flex-col" style={{maxHeight:"70vh"}}>
          <div className="p-3 border-b border-gray-200/30 space-y-2">
            <div className="relative">
              <svg className="absolute left-3 top-2.5 w-4 h-4 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={Icons.search}/></svg>
              <input type="text" placeholder="ค้นหา User ID / ชื่อ..." value={search} onChange={e => setSearch(e.target.value)}
                className="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-slate-500 focus:outline-none focus:border-blue-500" />
            </div>
            <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
              {["all","LINE","Facebook"].map(p => (
                <button key={p} onClick={() => setPlatformFilter(p)}
                  className={"whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-bold transition border " + (platformFilter === p ? "bg-blue-600 border-blue-600 text-white shadow-md shadow-blue-500/10" : "bg-white border-gray-200 text-slate-600 hover:bg-gray-50 hover:border-gray-300")}>
                  {p === "all" ? "ทั้งหมด" : p}
                </button>
              ))}
            </div>
          </div>
          <div className="flex-1 overflow-y-auto">
            {filteredUsers.length === 0 ? (
              <div className="p-4 text-center text-gray-400 text-sm">ไม่พบรายการแชท</div>
            ) : filteredUsers.map(u => (
              <div key={u.user_id + u.platform}
                onClick={() => loadChat(u.user_id, u.platform)}
                className={"flex items-center gap-3 px-4 py-3 cursor-pointer border-b border-gray-200/20 transition hover:bg-gray-100/30 " +
                  (selectedUser?.userId === u.user_id && selectedUser?.platform === u.platform ? "bg-blue-600/10 border-l-2 border-l-blue-500" : "")}>
                <div className={"w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold " + (u.platform === "LINE" ? "bg-green-600" : "bg-blue-600")}>
                  {u.platform === "LINE" ? "L" : "F"}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-gray-900 text-sm font-medium truncate">{u.user_name || u.user_id.slice(0, 12) + "..."}</div>
                  <div className="text-gray-400 text-xs truncate">{u.message_count ? `${u.message_count} ข้อความ` : ""}</div>
                </div>
                <div className="text-gray-400 text-xs whitespace-nowrap">{formatTime(u.last_message_at)}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Right: Chat Messages */}
        <div className="flex-1 bg-white rounded-xl border border-gray-200/50 flex flex-col" style={{maxHeight:"70vh"}}>
          {!selectedUser ? (
            <div className="flex-1 flex items-center justify-center text-gray-400">
              <div className="text-center">
                <svg className="w-12 h-12 mx-auto mb-3 opacity-30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d={Icons.chat}/></svg>
                <p className="text-sm">เลือกรายชื่อลูกค้าทางซ้ายเพื่อดูประวัติแชท</p>
              </div>
            </div>
          ) : (
            <>
              <div className="px-4 py-3 border-b border-gray-200/30 flex items-center gap-3">
                <button onClick={() => { setSelectedUser(null); setMessages([]); }} className="lg:hidden text-gray-500 hover:text-gray-900">
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <div className={"w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold " + (selectedUser.platform === "LINE" ? "bg-green-600" : "bg-blue-600")}>
                  {selectedUser.platform === "LINE" ? "L" : "F"}
                </div>
                <div>
                  <div className="text-gray-900 text-sm font-medium">{selectedUser.userId.slice(0, 20)}{selectedUser.userId.length > 20 ? "..." : ""}</div>
                  <div className="text-gray-500 text-xs">{selectedUser.platform}</div>
                </div>
              </div>
              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                {loadingMsgs ? (
                  <div className="flex justify-center py-10"><div className="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin" /></div>
                ) : messages.length === 0 ? (
                  <div className="text-center text-gray-400 text-sm py-10">ไม่พบข้อความ</div>
                ) : messages.map((m, i) => (
                  <div key={i} className={"flex " + (m.direction === "in" ? "justify-start" : "justify-end")}>
                    <div className={"max-w-xs lg:max-w-md px-3 py-2 rounded-xl text-sm whitespace-pre-wrap " +
                      (m.direction === "in"
                        ? "bg-gray-100 text-white rounded-bl-none"
                        : "bg-blue-600 text-white rounded-br-none")}>
                      {m.message_type === "image" ? (
                        <span className="text-gray-700 italic">[รูปภาพ]</span>
                      ) : m.message}
                      <div className={"text-xs mt-1 " + (m.direction === "in" ? "text-gray-500" : "text-blue-200")}>
                        {formatTime(m.created_at)}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  SHARED COMPONENTS
// ═══════════════════════════════════════════════════════════
function Loader() {
  return <div className="flex justify-center py-20"><div className="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin" /></div>;
}

function DropdownSelect({ value, onChange, options, placeholder, className }) {
  const [open, setOpen] = useState(false);
  const ref = React.useRef(null);
  useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", handler);
    document.addEventListener("touchstart", handler);
    return () => { document.removeEventListener("mousedown", handler); document.removeEventListener("touchstart", handler); };
  }, [open]);
  const selected = options.find(o => (typeof o === "object" ? o.value : o) === value);
  const displayLabel = selected ? (typeof selected === "object" ? selected.label : selected) : (placeholder || "-- เลือก --");
  return (
    <div ref={ref} className={"relative " + (className || "")}>
      <button type="button" onClick={() => setOpen(!open)}
        className={"w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500 transition flex items-center justify-between text-left " + (selected ? "text-gray-900" : "text-gray-400")}>
        <span className="truncate">{displayLabel}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className={"transition-transform " + (open ? "rotate-180" : "")}><path d="M6 9l6 6 6-6"/></svg>
      </button>
      {open && (
        <div className="absolute top-full left-0 mt-1 w-full bg-white border border-gray-300 rounded-lg shadow-xl max-h-48 overflow-y-auto z-50">
          {options.map((opt, i) => {
            const optVal = typeof opt === "object" ? opt.value : opt;
            const optLabel = typeof opt === "object" ? opt.label : opt;
            const isSelected = optVal === value;
            return (
              <button key={i} type="button"
                onClick={() => { onChange(optVal); setOpen(false); }}
                className={"w-full text-left px-3 py-2.5 text-sm transition truncate " + (isSelected ? "bg-blue-50 text-blue-700 font-medium" : "text-gray-700 hover:bg-gray-100 active:bg-gray-200")}>
                {optLabel}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Field({ label, val, set, ph, area, type = "text", datalist = null }) {
  const cls = "w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 text-sm outline-none focus:border-blue-500 transition";
  
  const [focused, setFocused] = useState(false);
  
  let inputElement;
  if (area) {
    inputElement = <textarea value={val || ""} onChange={e => set(e.target.value)} placeholder={ph} rows={3} className={cls + " resize-none"} />;
  } else if (type === "date") {
    const inputRef = React.useRef(null);
    const fdateTHMedium = (d) => {
      if (!d) return "";
      const date = new Date(d);
      if (isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("th-TH", { day: "numeric", month: "short", year: "numeric" }).format(date);
    };
    const displayVal = val ? fdateTHMedium(val) : "";
    
    inputElement = (
      <div className="relative">
        <input 
          type="text" 
          readOnly
          onClick={() => inputRef.current && inputRef.current.showPicker()}
          className={cls + " pr-9 cursor-pointer"} 
          value={displayVal} 
          placeholder={ph || "วว/ดด/ปปปป"} 
        />
        <input 
          type="date" 
          ref={inputRef}
          value={val || ""}
          onChange={e => set(e.target.value)}
          className="absolute inset-0 opacity-0 pointer-events-none" 
        />
        <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
          <Icon d={Icons.calendar} size={16} />
        </div>
      </div>
    );
  } else {
    const dlId = datalist ? "dl_" + label.replace(/[^a-zA-Z0-9]/g, "") + "_cat" : undefined;
    inputElement = (
      <>
        <input type={type} value={val || ""} onChange={e => set(e.target.value)} placeholder={ph} className={cls} list={dlId} />
        {datalist && (
          <datalist id={dlId}>
            {datalist.map((o, i) => <option key={i} value={o} />)}
          </datalist>
        )}
      </>
    );
  }

  return (
    <div>
      <label className="block text-gray-500 text-xs mb-1">{label}</label>
      {inputElement}
    </div>
  );
}

function Modal({ title, children, onClose, onSave }) {
  return (
    <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm sm:p-4" onClick={onClose}>
      <div className="bg-white border border-gray-200 rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[90vh] overflow-y-auto p-5 sm:p-6" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-gray-900 text-lg font-bold">{title}</h3>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-900"><Icon d={Icons.x} size={20} /></button>
        </div>
        {children}
        <div className="flex justify-end gap-2 mt-5 pb-2">
          <button onClick={onClose} className="px-4 py-2 text-sm text-gray-500 hover:text-gray-900 transition">ยกเลิก</button>
          <button onClick={onSave} className="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition">บันทึก</button>
        </div>
      </div>
    </div>
  );
}

function PackageManagementPage({ toast }) {
  const [packages, setPackages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({});

  const loadPackages = useCallback(() => {
    setLoading(true);
    api("/api/packages").then(r => { if (r.packages) setPackages(r.packages); })
      .catch(() => {}).finally(() => setLoading(false));
  }, []);
  useEffect(() => { loadPackages(); }, [loadPackages]);

  const openEdit = (pkg) => {
    if (pkg) {
      setEditing(pkg.id);
      let extractedProvider = "claude";
      let extractedModel = "";
      let plainFeatures = [];
      (pkg.features || []).forEach(f => {
        if (typeof f === 'string' && f.startsWith("_ai_provider:")) extractedProvider = f.split(":")[1];
        else if (typeof f === 'string' && f.startsWith("_ai_model:")) extractedModel = f.split(":")[1];
        else plainFeatures.push(f);
      });
      setForm({
        name: pkg.name, price: pkg.price, msg_limit: pkg.msg_limit,
        product_limit: pkg.product_limit, description: pkg.description || "",
        featuresText: plainFeatures.join("\n"),
        ai_provider: extractedProvider,
        ai_model: extractedModel
      });
    } else {
      setEditing("new");
      setForm({
        name: "", price: 0, msg_limit: 100, product_limit: 20,
        description: "", featuresText: "",
        ai_provider: "claude", ai_model: ""
      });
    }
  };

  const savePackage = async () => {
    setSaving(true);
    const featuresArr = form.featuresText.split("\n").filter(f => f.trim());
    if (form.ai_provider) featuresArr.push(`_ai_provider:${form.ai_provider}`);
    if (form.ai_model) featuresArr.push(`_ai_model:${form.ai_model}`);
    
    const body = {
      name: form.name, price: parseInt(form.price) || 0,
      msg_limit: parseInt(form.msg_limit) || 0, product_limit: parseInt(form.product_limit) || 0,
      description: form.description,
      features: featuresArr,
    };
    const endpoint = editing === "new" ? "/api/packages" : "/api/packages/" + editing;
    const method = editing === "new" ? "POST" : "PUT";
    const res = await api(endpoint, { method, body });
    setSaving(false);
    if (res.success) {
      toast("บันทึกแพ็กเกจแล้ว", "ok");
      setEditing(null);
      loadPackages();
    } else { toast(res.error || "บันทึกไม่สำเร็จ", "err"); }
  };

  const deletePackage = async (id) => {
    if (!window.confirm("คุณแน่ใจหรือไม่ว่าต้องการลบแพ็กเกจนี้?")) return;
    setSaving(true);
    const res = await api("/api/packages/" + id, { method: "DELETE" });
    setSaving(false);
    if (res.success) {
      toast("ลบแพ็กเกจแล้ว", "ok");
      setEditing(null);
      loadPackages();
    } else { toast(res.error || "ลบไม่สำเร็จ", "err"); }
  };

  const pkgColors = { 
    Free: "from-slate-600 to-slate-700", Starter: "from-slate-600 to-slate-700", 
    Pro: "from-blue-600 to-indigo-700", Standard: "from-blue-600 to-indigo-700", 
    Business: "from-amber-500 to-orange-600", Elite: "from-amber-500 to-orange-600",
    Enterprise: "from-purple-600 to-fuchsia-700" 
  };
  const pkgBorders = { 
    Free: "border-gray-300", Starter: "border-gray-300", 
    Pro: "border-blue-500", Standard: "border-blue-500", 
    Business: "border-amber-500", Elite: "border-amber-500",
    Enterprise: "border-purple-500" 
  };

  if (loading) return <Loader />;

  return (
    <div>
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-xl font-bold text-gray-900">จัดการแพ็กเกจ</h2>
        <button onClick={() => openEdit(null)} className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
          <Icon d={Icons.plus} size={16} /> สร้างแพ็กเกจใหม่
        </button>
      </div>
      <div className="grid md:grid-cols-3 gap-4">
        {packages.map(pkg => (
          <div key={pkg.id} className={"bg-white border rounded-2xl overflow-hidden " + (pkgBorders[pkg.name] || "border-gray-200")}>
            <div className={"bg-gradient-to-r p-4 " + (pkgColors[pkg.name] || "from-slate-600 to-slate-700")}>
              <div className="text-gray-900 font-bold text-lg">{pkg.name}</div>
              <div className="text-white/80 text-xs">{pkg.description}</div>
            </div>
            <div className="p-4">
              <div className="text-gray-900 text-2xl font-black mb-1">
                {pkg.price === 0 ? "ฟรี" : ("฿" + pkg.price.toLocaleString())}
                {pkg.price > 0 && <span className="text-gray-500 text-sm font-normal">/เดือน</span>}
              </div>
              <div className="text-gray-500 text-xs mb-3">
                {pkg.msg_limit === -1 ? "ข้อความไม่จำกัด" : (pkg.msg_limit + " ข้อความ/เดือน")} | {pkg.product_limit === -1 ? "สินค้าไม่จำกัด" : (pkg.product_limit + " สินค้า")}
              </div>
              <div className="space-y-1.5 mb-4">
                {(pkg.features || []).map((f, i) => (
                  <div key={i} className="flex items-start gap-2 text-sm text-gray-700">
                    <span className="text-emerald-400 mt-0.5"><Icon d={Icons.check} size={14} /></span>
                    <span>{f}</span>
                  </div>
                ))}
              </div>
              <button onClick={() => openEdit(pkg)}
                className="w-full text-center py-2 rounded-lg text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-700 transition">
                แก้ไข
              </button>
            </div>
          </div>
        ))}
      </div>

      {editing && (
        <Modal title={editing === "new" ? "สร้างแพ็กเกจใหม่" : "แก้ไขแพ็กเกจ: " + form.name} onClose={() => setEditing(null)} onSave={savePackage}>
          <div className="space-y-3">
            <Field label="ชื่อแพ็กเกจ" val={form.name} set={v => setForm({ ...form, name: v })} />
            <Field label="ราคา (฿/เดือน)" val={form.price} set={v => setForm({ ...form, price: v })} />
            <div className="grid grid-cols-2 gap-3">
              <Field label="ข้อความ/เดือน (-1 = ไม่จำกัด)" val={form.msg_limit} set={v => setForm({ ...form, msg_limit: v })} />
              <Field label="สินค้าสูงสุด (-1 = ไม่จำกัด)" val={form.product_limit} set={v => setForm({ ...form, product_limit: v })} />
            </div>
            <Field label="คำอธิบาย" val={form.description} set={v => setForm({ ...form, description: v })} />
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-gray-400 text-xs mb-1">AI เริ่มต้น</label>
                <select value={form.ai_provider || "claude"} onChange={e => setForm({ ...form, ai_provider: e.target.value })}
                  className="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-white">
                  <option value="claude">Claude (Anthropic)</option>
                  <option value="deepseek">DeepSeek</option>
                  <option value="openai">OpenAI (ChatGPT)</option>
                  <option value="gemini">Google Gemini</option>
                  <option value="typhoon">OpenTyphoon</option>
                </select>
              </div>
              <div>
                <label className="block text-gray-400 text-xs mb-1">AI Model (ปล่อยว่าง=ใช้ค่าระบบ)</label>
                <input type="text" value={form.ai_model || ""} onChange={e => setForm({ ...form, ai_model: e.target.value })}
                  placeholder="เช่น claude-3-5-sonnet-latest"
                  className="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-white placeholder-gray-600" />
              </div>
            </div>
            <Field label="ฟีเจอร์ (บรรทัดละ 1 รายการ)" val={form.featuresText} set={v => setForm({ ...form, featuresText: v })} area />
            
            {editing !== "new" && (
              <div className="pt-4 border-t border-gray-100 mt-2">
                <button onClick={() => deletePackage(editing)}
                  className="w-full text-center py-2 rounded-lg text-sm font-semibold text-red-600 bg-red-50 hover:bg-red-100 transition">
                  ลบแพ็กเกจนี้
                </button>
              </div>
            )}
          </div>
          {saving && <div className="text-center text-gray-500 text-xs mt-2">กำลังดำเนินการ...</div>}
        </Modal>
      )}
    </div>
  );
}

function AIKeyInput({ label, settingKey, settings, onSave }) {
  const [val, setVal] = useState("");
  const [editing, setEditing] = useState(false);
  const [saving, setSaving] = useState(false);
  const isSet = settings[settingKey + "_set"];
  const masked = settings[settingKey] || "";

  const save = async () => {
    if (!val.trim()) return;
    setSaving(true);
    const res = await api("/api/settings", { method: "PUT", body: { key: settingKey, value: val.trim() } });
    setSaving(false);
    if (res.success) { onSave(); setEditing(false); setVal(""); }
  };

  const clear = async () => {
    setSaving(true);
    await api("/api/settings", { method: "PUT", body: { key: settingKey, value: "" } });
    setSaving(false);
    onSave();
  };

  if (editing) {
    return (
      <div>
        <label className="block text-gray-500 text-xs mb-1">{label}</label>
        <div className="flex gap-2">
          <input type="text" value={val} onChange={e => setVal(e.target.value)}
            placeholder="sk-ant-... หรือ sk-..."
            className="flex-1 bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 text-sm outline-none focus:border-blue-500 font-mono" />
          <button onClick={save} disabled={saving || !val.trim()}
            className="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-xs font-semibold rounded-lg transition">
            {saving ? "..." : "บันทึก"}
          </button>
          <button onClick={() => { setEditing(false); setVal(""); }}
            className="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs rounded-lg transition">
            ยกเลิก
          </button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <label className="block text-gray-500 text-xs mb-1">{label}</label>
      <div className="flex items-center gap-2">
        <div className={"flex-1 bg-gray-50 border rounded-lg px-3 py-2 text-sm font-mono " +
          (isSet ? "border-emerald-600/30 text-gray-500" : "border-gray-200 text-slate-600")}>
          {isSet ? masked : "ยังไม่ได้ตั้งค่า"}
        </div>
        <button onClick={() => setEditing(true)}
          className="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg transition whitespace-nowrap">
          {isSet ? "เปลี่ยน" : "ใส่ Key"}
        </button>
        {isSet && (
          <button onClick={clear} disabled={saving}
            className="px-3 py-2 bg-red-600/20 hover:bg-red-600/40 text-red-400 text-xs rounded-lg transition">
            ลบ
          </button>
        )}
      </div>
    </div>
  );
}

function AIManagementPage({ toast }) {
  const [shops, setShops] = useState([]);
  const [settings, setSettings] = useState({});
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(null);
  const [expandedProvider, setExpandedProvider] = useState(null);
  const [shopKeyEditing, setShopKeyEditing] = useState(null);
  const [shopKeyVal, setShopKeyVal] = useState("");

  const loadAll = useCallback(() => {
    setLoading(true);
    Promise.all([
      api("/api/shops").then(r => { if (r.shops) setShops(r.shops); }),
      api("/api/settings").then(r => { if (r.settings) setSettings(r.settings); }),
    ]).catch(() => {}).finally(() => setLoading(false));
  }, []);
  useEffect(() => { loadAll(); }, [loadAll]);

  const reloadSettings = () => {
    api("/api/settings").then(r => { if (r.settings) setSettings(r.settings); toast("บันทึก API Key สำเร็จ", "ok"); });
  };

  const updateShopAI = async (shopId, ai_provider, ai_model, ai_key) => {
    setSaving(shopId);
    const body = { ai_provider, ai_model };
    if (ai_key !== undefined) body.ai_key = ai_key;
    const res = await api("/api/shops/" + shopId + "/ai", { method: "PUT", body });
    setSaving(null);
    if (res.success) {
      toast("บันทึกสำเร็จ", "ok");
      setShops(prev => prev.map(s => s.id === shopId ? { ...s, ai_provider, ai_model, ai_key: res.shop?.ai_key || s.ai_key } : s));
    } else { toast(res.error || "บันทึกไม่สำเร็จ", "err"); }
  };

  const changeProvider = (shopId, newProvider) => {
    const p = AI_PROVIDERS.find(x => x.id === newProvider);
    const defaultModel = p ? p.models[0].value : "";
    updateShopAI(shopId, newProvider, defaultModel);
  };

  const changeModel = (shopId, currentProvider, newModel) => {
    updateShopAI(shopId, currentProvider, newModel);
  };

  const saveShopKey = async (shopId, prov, model) => {
    await updateShopAI(shopId, prov, model, shopKeyVal.trim());
    setShopKeyEditing(null);
    setShopKeyVal("");
  };

  const clearShopKey = async (shopId, prov, model) => {
    await updateShopAI(shopId, prov, model, "");
  };

  const getModelsForProvider = (providerId) => {
    const p = AI_PROVIDERS.find(x => x.id === providerId);
    return p ? p.models.map(m => ({ value: m.value, label: m.label + (m.badge ? " (" + m.badge + ")" : "") })) : [];
  };

  const providerKeyMap = { claude: "claude_key", openai: "openai_key", gemini: "gemini_key", typhoon: "typhoon_key" };

  if (loading) return <Loader />;

  return (
    <div>
      <h2 className="text-xl font-bold text-gray-900 mb-2">จัดการ AI</h2>
      <p className="text-gray-500 text-sm mb-6">ตั้งค่า API Keys, เลือก Provider และ Model สำหรับแต่ละร้านค้า</p>

      {/* ══════ Section 1: Global API Keys ══════ */}
      <div className="bg-white border border-gray-200 rounded-2xl p-5 mb-8">
        <h3 className="text-lg font-bold text-gray-900 mb-1 flex items-center gap-2">
          <Icon d={Icons.save} size={18} /> API Keys กลาง
        </h3>
        <p className="text-gray-500 text-xs mb-4">Key กลางที่ทุกร้านใช้ร่วมกัน (ร้านที่มี key ของตัวเองจะใช้ key ของร้านแทน)</p>
        <div className="space-y-3">
          <AIKeyInput label="Claude API Key" settingKey="claude_key" settings={settings} onSave={reloadSettings} />
          <AIKeyInput label="OpenAI API Key" settingKey="openai_key" settings={settings} onSave={reloadSettings} />
          <AIKeyInput label="Gemini API Key" settingKey="gemini_key" settings={settings} onSave={reloadSettings} />
          <AIKeyInput label="DeepSeek API Key" settingKey="deepseek_key" settings={settings} onSave={reloadSettings} />
          <AIKeyInput label="Typhoon API Key" settingKey="typhoon_key" settings={settings} onSave={reloadSettings} />
        </div>
        <div className="mt-4 bg-amber-50 border border-amber-200 rounded-lg p-3 text-amber-800 text-xs">
          <strong>ลำดับการใช้ Key:</strong> Key ของร้าน (ถ้ามี) → Key กลาง (ที่ตั้งไว้ด้านบน) → Key จาก .env (Vercel/Railway)
        </div>
      </div>

      {/* ══════ Section 2: AI Provider Cards ══════ */}
      <div className="grid sm:grid-cols-2 gap-4 mb-8">
        {AI_PROVIDERS.map(p => {
          const isOpen = expandedProvider === p.id;
          const shopCount = shops.filter(s => s.ai_provider === p.id).length;
          const hasGlobalKey = settings[p.id === "claude" ? "claude_key_set" : p.id === "openai" ? "openai_key_set" : p.id === "gemini" ? "gemini_key_set" : "typhoon_key_set"];
          return (
            <div key={p.id} className={"bg-white border rounded-2xl overflow-hidden transition-all " + (p.border)}>
              <button onClick={() => setExpandedProvider(isOpen ? null : p.id)}
                className="w-full text-left">
                <div className={"bg-gradient-to-r p-4 flex items-center gap-3 " + p.color}>
                  <div className="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                    <Icon d={p.icon} size={20} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="text-gray-900 font-bold flex items-center gap-2">
                      {p.name}
                      {hasGlobalKey && <span className="w-2 h-2 rounded-full bg-emerald-400" title="มี API Key แล้ว" />}
                    </div>
                    <div className="text-white/70 text-xs">{p.models.length} models | ใช้อยู่ {shopCount} ร้าน</div>
                  </div>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"
                    className={"text-white/70 transition-transform " + (isOpen ? "rotate-180" : "")}>
                    <path d="M6 9l6 6 6-6"/>
                  </svg>
                </div>
              </button>
              {isOpen && (
                <div className="p-4 space-y-2">
                  {p.models.map(m => (
                    <div key={m.value} className="bg-gray-50 border border-gray-200/50 rounded-xl p-3 flex items-center gap-3">
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2">
                          <span className="text-gray-900 text-sm font-medium">{m.label}</span>
                          {m.badge && (
                            <span className={"text-xs px-1.5 py-0.5 rounded-full " + (
                              m.badge === "แนะนำ" ? "bg-emerald-600/20 text-emerald-300" :
                              m.badge === "Premium" ? "bg-amber-600/20 text-amber-300" :
                              "bg-slate-600/30 text-gray-500"
                            )}>{m.badge}</span>
                          )}
                        </div>
                        <div className="text-gray-500 text-xs mt-0.5">{m.desc}</div>
                      </div>
                      <div className="text-gray-400 text-xs whitespace-nowrap font-mono hidden sm:block">{m.value.length > 25 ? m.value.slice(0,22)+"..." : m.value}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* ══════ Section 3: Per-Shop AI Assignment ══════ */}
      <h3 className="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
        <Icon d={Icons.settings} size={18} /> ตั้งค่า AI ประจำร้านค้า
      </h3>

      {shops.length === 0 ? (
        <div className="bg-white border border-gray-200 rounded-xl p-8 text-center text-gray-400">ยังไม่มีร้านค้า</div>
      ) : (
        <div className="space-y-3">
          {shops.map(shop => {
            const prov = shop.ai_provider || "claude";
            const model = shop.ai_model || "";
            const providerData = AI_PROVIDERS.find(x => x.id === prov) || AI_PROVIDERS[0];
            const modelOptions = getModelsForProvider(prov);
            const isSavingThis = saving === shop.id;
            const hasShopKey = !!(shop.ai_key && shop.ai_key !== "");
            const isEditingKey = shopKeyEditing === shop.id;
            return (
              <div key={shop.id} className={"bg-white border rounded-xl p-4 transition " + (isSavingThis ? "border-blue-500/50" : "border-gray-200")}>
                {/* Shop name + status */}
                <div className="flex items-center gap-2 mb-3">
                  <span className={"w-2.5 h-2.5 rounded-full " + (shop.status === "active" ? "bg-emerald-400" : "bg-red-400")} />
                  <span className="text-gray-900 font-medium">{shop.name}</span>
                  {isSavingThis && <span className="text-blue-400 text-xs animate-pulse ml-auto">กำลังบันทึก...</span>}
                </div>
                {/* Provider + Model dropdowns */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                  <div>
                    <label className="block text-gray-500 text-xs mb-1">AI Provider</label>
                    <DropdownSelect
                      value={prov}
                      onChange={v => changeProvider(shop.id, v)}
                      options={AI_PROVIDERS.map(x => ({ value: x.id, label: x.name }))}
                    />
                  </div>
                  <div>
                    <label className="block text-gray-500 text-xs mb-1">Model</label>
                    <DropdownSelect
                      value={model}
                      onChange={v => changeModel(shop.id, prov, v)}
                      options={modelOptions}
                      placeholder="เลือก Model"
                    />
                  </div>
                </div>
                {/* Per-shop API Key */}
                <div className="border-t border-gray-200/50 pt-3">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="text-gray-500 text-xs">API Key ของร้าน</span>
                      {hasShopKey ? (
                        <span className="text-xs px-1.5 py-0.5 rounded-full bg-emerald-600/20 text-emerald-300">ใช้ Key ของร้าน</span>
                      ) : (
                        <span className="text-xs px-1.5 py-0.5 rounded-full bg-gray-100 text-gray-500">ใช้ Key กลาง</span>
                      )}
                    </div>
                    {!isEditingKey && (
                      <div className="flex gap-1.5">
                        <button onClick={() => { setShopKeyEditing(shop.id); setShopKeyVal(""); }}
                          className="text-blue-400 hover:text-blue-300 text-xs transition">
                          {hasShopKey ? "เปลี่ยน" : "ใส่ Key"}
                        </button>
                        {hasShopKey && (
                          <button onClick={() => clearShopKey(shop.id, prov, model)}
                            className="text-red-400 hover:text-red-300 text-xs transition">ลบ</button>
                        )}
                      </div>
                    )}
                  </div>
                  {hasShopKey && !isEditingKey && (
                    <div className="text-gray-400 text-xs font-mono mt-1">{shop.ai_key}</div>
                  )}
                  {isEditingKey && (
                    <div className="flex gap-2 mt-2">
                      <input type="text" value={shopKeyVal} onChange={e => setShopKeyVal(e.target.value)}
                        placeholder="ใส่ API Key ของร้านนี้"
                        className="flex-1 bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 text-xs outline-none focus:border-blue-500 font-mono" />
                      <button onClick={() => saveShopKey(shop.id, prov, model)} disabled={!shopKeyVal.trim()}
                        className="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-xs font-semibold rounded-lg transition">บันทึก</button>
                      <button onClick={() => setShopKeyEditing(null)}
                        className="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs rounded-lg transition">ยกเลิก</button>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── Info Box ── */}
      <div className="mt-6 bg-blue-50 border border-blue-200 rounded-xl p-4 text-blue-800 text-xs space-y-1">
        <div className="font-semibold text-sm mb-1 text-blue-900">คำแนะนำการเลือก AI</div>
        <div>• <strong>Claude Sonnet 4</strong> — สมดุลระหว่างความเร็วและความฉลาด เหมาะกับร้านค้าทั่วไป</div>
        <div>• <strong>Typhoon v2 70B</strong> — เข้าใจภาษาไทยดีที่สุด เหมาะกับร้านค้าที่สื่อสารภาษาไทย 100%</div>
        <div>• <strong>GPT-4o Mini / Gemini Flash</strong> — ราคาถูก เหมาะกับร้านค้า Free tier ที่ต้องการประหยัด</div>
        <div>• ร้านค้าที่ใส่ Key ของตัวเองจะถูกคิดค่าใช้จ่ายจาก Key ของร้านนั้นเอง</div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  SUPER ADMIN — Billing & Payment Page
// ═══════════════════════════════════════════════════════════
function BillingPage({ toast }) {
  const [tab, setTab] = useState("bills"); // bills | usage | payment
  const [bills, setBills] = useState([]);
  const [shops, setShops] = useState([]);
  const [packages, setPackages] = useState([]);
  const [usage, setUsage] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showCreate, setShowCreate] = useState(false);
  const [editBill, setEditBill] = useState(null);
  const [editPayment, setEditPayment] = useState(null);
  const [form, setForm] = useState({});
  const [payForm, setPayForm] = useState({});

  const loadAll = useCallback(() => {
    setLoading(true);
    Promise.all([
      api("/api/billing").then(r => setBills(r.bills || [])),
      api("/api/shops").then(r => setShops(r.shops || [])),
      api("/api/packages").then(r => setPackages(r.packages || [])),
      api("/api/usage").then(r => setUsage(r.usage || [])),
    ]).catch(() => {}).finally(() => setLoading(false));
  }, []);
  useEffect(() => { loadAll(); }, [loadAll]);

  // ── Create Bill ──
  const openCreateBill = () => {
    const today = new Date().toISOString().slice(0,10);
    const next = new Date(Date.now() + 30*86400000).toISOString().slice(0,10);
    setForm({ shop_id: "", package_name: "Pro", amount: 1500, period_start: today, period_end: next, note: "" });
    setShowCreate(true);
  };
  const createBill = async () => {
    if (!form.shop_id) { toast("กรุณาเลือกร้านค้า", "err"); return; }
    const res = await api("/api/billing", { method: "POST", body: form });
    if (res.success) { toast("สร้างบิลสำเร็จ", "ok"); setShowCreate(false); loadAll(); }
    else toast(res.error || "สร้างไม่สำเร็จ", "err");
  };

  // ── Confirm / Update Bill ──
  const confirmPaid = async (bill) => {
    const res = await api("/api/billing/" + bill.id, { method: "PUT", body: { status: "paid" } });
    if (res.success) { toast("ยืนยันชำระเงินสำเร็จ — ต่ออายุร้านแล้ว", "ok"); loadAll(); }
    else toast(res.error || "ยืนยันไม่สำเร็จ", "err");
  };
  const markOverdue = async (bill) => {
    const res = await api("/api/billing/" + bill.id, { method: "PUT", body: { status: "overdue" } });
    if (res.success) { toast("ระงับร้านค้าแล้ว", "ok"); loadAll(); }
    else toast(res.error || "ผิดพลาด", "err");
  };

  // ── Shop Payment Settings ──
  const openPaymentEdit = (shop) => {
    setPayForm({
      payment_transfer: shop.payment_transfer !== false,
      payment_promptpay: shop.payment_promptpay || "", payment_bank_name: shop.payment_bank_name || "",
      payment_bank_account: shop.payment_bank_account || "", payment_bank_acc_name: shop.payment_bank_acc_name || "",
      payment_cod: !!shop.payment_cod, payment_cod_fee: shop.payment_cod_fee || "",
      payment_pickup: !!shop.payment_pickup,
    });
    setEditPayment(shop);
  };
  const savePayment = async () => {
    const res = await api("/api/shops/" + editPayment.id + "/payment", { method: "PUT", body: payForm });
    if (res.success) { toast("บันทึกวิธีชำระเงินสำเร็จ", "ok"); setEditPayment(null); loadAll(); }
    else toast(res.error || "บันทึกไม่สำเร็จ", "err");
  };

  const statusColors = { pending: "bg-amber-600/20 text-amber-300", paid: "bg-emerald-600/20 text-emerald-300", overdue: "bg-red-600/20 text-red-300", cancelled: "bg-slate-600/20 text-gray-500" };
  const statusLabels = { pending: "รอชำระ", paid: "ชำระแล้ว", overdue: "เกินกำหนด", cancelled: "ยกเลิก" };

  if (loading) return <Loader />;

  const pendingBills = bills.filter(b => b.status === "pending");
  const paidBills = bills.filter(b => b.status === "paid");
  const totalRevenue = paidBills.reduce((s, b) => s + (b.amount || 0), 0);

  const tabBtn = (id, label, count) => (
    <button key={id} onClick={() => setTab(id)}
      className={"px-4 py-2 text-sm font-medium rounded-lg transition " +
        (tab === id ? "bg-blue-600 text-white" : "bg-white text-gray-500 hover:text-gray-900")}>
      {label} {count !== undefined && <span className="ml-1 text-xs opacity-70">({count})</span>}
    </button>
  );

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-xl font-bold text-gray-900">การเงิน & การชำระเงิน</h2>
        <button onClick={openCreateBill} className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
          <Icon d={Icons.plus} size={16} /> สร้างบิล
        </button>
      </div>

      {/* Summary cards */}
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        {[
          { label: "รายได้รวม", val: "฿" + totalRevenue.toLocaleString(), color: "text-emerald-400" },
          { label: "รอชำระ", val: pendingBills.length, color: "text-amber-400" },
          { label: "ชำระแล้ว", val: paidBills.length, color: "text-blue-400" },
          { label: "ร้านค้าทั้งหมด", val: shops.length, color: "text-violet-400" },
        ].map((c, i) => (
          <div key={i} className="bg-white border border-gray-200 rounded-xl p-3 text-center">
            <div className={"text-xl font-black " + c.color}>{c.val}</div>
            <div className="text-gray-500 text-xs mt-1">{c.label}</div>
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div className="flex gap-2 mb-5 flex-wrap">
        {tabBtn("bills", "บิลทั้งหมด", bills.length)}
        {tabBtn("usage", "Usage Dashboard", usage.length)}
        {tabBtn("payment", "วิธีชำระเงินร้านค้า", shops.length)}
      </div>

      {/* ══════ TAB: Bills ══════ */}
      {tab === "bills" && (
        <div className="space-y-3">
          {bills.length === 0 ? (
            <div className="bg-white border border-gray-200 rounded-xl p-8 text-center text-gray-400">ยังไม่มีบิล</div>
          ) : bills.map(bill => (
            <div key={bill.id} className="bg-white border border-gray-200 rounded-xl p-4">
              <div className="flex flex-col sm:flex-row sm:items-center gap-3">
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-gray-900 font-medium">{bill.shops?.name || "ร้านค้า"}</span>
                    <span className={"text-xs px-2 py-0.5 rounded-full " + (statusColors[bill.status] || "")}>{statusLabels[bill.status] || bill.status}</span>
                  </div>
                  <div className="text-gray-500 text-xs space-x-3">
                    <span>แพ็กเกจ: {bill.package_name}</span>
                    <span>฿{(bill.amount || 0).toLocaleString()}</span>
                    <span>{bill.period_start} → {bill.period_end}</span>
                  </div>
                  {bill.paid_at && <div className="text-emerald-400 text-xs mt-1">ชำระเมื่อ: {new Date(bill.paid_at).toLocaleString("th-TH")}</div>}
                  {bill.note && <div className="text-gray-400 text-xs mt-1">หมายเหตุ: {bill.note}</div>}
                </div>
                {bill.status === "pending" && (
                  <div className="flex gap-2">
                    <button onClick={() => confirmPaid(bill)}
                      className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg transition">
                      <Icon d={Icons.check} size={14} /> ยืนยันชำระ
                    </button>
                    <button onClick={() => markOverdue(bill)}
                      className="px-3 py-1.5 bg-red-600/20 hover:bg-red-600/40 text-red-400 text-xs rounded-lg transition">
                      ระงับ
                    </button>
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ══════ TAB: Usage Dashboard ══════ */}
      {tab === "usage" && (
        <div className="space-y-3">
          {usage.map(shop => {
            const pct = shop.msg_percent || 0;
            const barColor = pct >= 90 ? "bg-red-500" : pct >= 70 ? "bg-amber-500" : "bg-emerald-500";
            const isUnlimited = shop.msg_limit === -1;
            return (
              <div key={shop.id} className="bg-white border border-gray-200 rounded-xl p-4">
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2">
                    <span className={"w-2 h-2 rounded-full " + (shop.status === "active" ? "bg-emerald-400" : "bg-red-400")} />
                    <span className="text-gray-900 font-medium">{shop.name}</span>
                    <span className="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-700">{shop.package_name || "free"}</span>
                  </div>
                  {shop.expired_at && (
                    <span className={"text-xs " + (new Date(shop.expired_at) < new Date() ? "text-red-400" : "text-gray-500")}>
                      หมดอายุ: {new Date(shop.expired_at).toLocaleDateString("th-TH")}
                    </span>
                  )}
                </div>
                <div className="flex items-center gap-3">
                  <div className="flex-1">
                    <div className="flex items-center justify-between text-xs mb-1">
                      <span className="text-gray-500">ข้อความ</span>
                      <span className="text-gray-700">
                        {shop.msg_used_this_month || 0} / {isUnlimited ? "∞" : shop.msg_limit}
                      </span>
                    </div>
                    <div className="w-full bg-gray-100 rounded-full h-2">
                      <div className={barColor + " h-2 rounded-full transition-all"} style={{ width: (isUnlimited ? 0 : Math.min(100, pct)) + "%" }} />
                    </div>
                  </div>
                  {!isUnlimited && <span className={"text-xs font-bold " + (pct >= 90 ? "text-red-400" : "text-gray-500")}>{pct}%</span>}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ══════ TAB: Shop Payment Settings ══════ */}
      {tab === "payment" && (
        <div className="space-y-3">
          {shops.map(shop => (
            <div key={shop.id} className="bg-white border border-gray-200 rounded-xl p-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-gray-900 font-medium">{shop.name}</span>
                <button onClick={() => openPaymentEdit(shop)} className="text-blue-400 hover:text-blue-300 text-xs font-medium transition">ตั้งค่า</button>
              </div>
              <div className="flex flex-wrap gap-2">
                {shop.payment_transfer !== false && <span className="text-xs px-2 py-1 rounded-full bg-emerald-100 text-emerald-800 font-medium">โอนเงิน</span>}
                {shop.payment_promptpay && <span className="text-xs px-2 py-1 rounded-full bg-blue-100 text-blue-800 font-medium">PromptPay</span>}
                {shop.payment_cod && <span className="text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-800 font-medium">COD</span>}
                {shop.payment_pickup && <span className="text-xs px-2 py-1 rounded-full bg-violet-100 text-violet-800 font-medium">รับหน้าร้าน</span>}
                {!shop.payment_transfer && !shop.payment_promptpay && !shop.payment_cod && !shop.payment_pickup && (
                  <span className="text-xs text-gray-400">ยังไม่ได้ตั้งค่า</span>
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ── Create Bill Modal ── */}
      {showCreate && (
        <Modal title="สร้างบิลใหม่" onClose={() => setShowCreate(false)} onSave={createBill}>
          <div className="space-y-3">
            <div>
              <label className="block text-gray-500 text-xs mb-1">ร้านค้า *</label>
              <DropdownSelect value={form.shop_id} onChange={v => setForm(f => ({ ...f, shop_id: v }))}
                placeholder="-- เลือกร้าน --"
                options={shops.map(s => ({ value: s.id, label: s.name }))} />
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-gray-500 text-xs mb-1">แพ็กเกจ</label>
                <DropdownSelect value={form.package_name} onChange={v => {
                  const pkg = packages.find(p => p.name === v);
                  setForm(f => ({ ...f, package_name: v, amount: pkg ? pkg.price : f.amount }));
                }} options={packages.map(p => ({ value: p.name, label: p.name + " — ฿" + p.price.toLocaleString() }))} />
              </div>
              <Field label="จำนวนเงิน (฿)" val={form.amount} set={v => setForm(f => ({ ...f, amount: parseInt(v) || 0 }))} />
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field type="date" label="เริ่ม" val={form.period_start} set={v => setForm(f => ({ ...f, period_start: v }))} ph="วว/ดด/ปปปป" />
              <Field type="date" label="สิ้นสุด" val={form.period_end} set={v => setForm(f => ({ ...f, period_end: v }))} ph="วว/ดด/ปปปป" />
            </div>
            <Field label="หมายเหตุ" val={form.note} set={v => setForm(f => ({ ...f, note: v }))} />
          </div>
        </Modal>
      )}

      {/* ── Payment Settings Modal ── */}
      {editPayment && (
        <Modal title={"วิธีชำระเงิน: " + editPayment.name} onClose={() => setEditPayment(null)} onSave={savePayment}>
          <div className="space-y-4">
            {/* Transfer */}
            <div className="bg-gray-50 border border-gray-200/50 rounded-xl p-3">
              <label className="flex items-center gap-2 text-gray-900 text-sm font-medium mb-2 cursor-pointer">
                <input type="checkbox" checked={payForm.payment_transfer} onChange={e => setPayForm(f => ({ ...f, payment_transfer: e.target.checked }))}
                  className="rounded border-gray-300 bg-white text-blue-500" />
                โอนเงิน / PromptPay
              </label>
              {payForm.payment_transfer && (
                <div className="space-y-2 ml-6">
                  <Field label="เลข PromptPay" val={payForm.payment_promptpay} set={v => setPayForm(f => ({ ...f, payment_promptpay: v }))} ph="0955851136" />
                  <Field label="ธนาคาร" val={payForm.payment_bank_name} set={v => setPayForm(f => ({ ...f, payment_bank_name: v }))} ph="กสิกรไทย" />
                  <Field label="เลขบัญชี" val={payForm.payment_bank_account} set={v => setPayForm(f => ({ ...f, payment_bank_account: v }))} />
                  <Field label="ชื่อบัญชี" val={payForm.payment_bank_acc_name} set={v => setPayForm(f => ({ ...f, payment_bank_acc_name: v }))} />
                </div>
              )}
            </div>
            {/* COD */}
            <div className="bg-gray-50 border border-gray-200/50 rounded-xl p-3">
              <label className="flex items-center gap-2 text-gray-900 text-sm font-medium mb-2 cursor-pointer">
                <input type="checkbox" checked={payForm.payment_cod} onChange={e => setPayForm(f => ({ ...f, payment_cod: e.target.checked }))}
                  className="rounded border-gray-300 bg-white text-blue-500" />
                เก็บเงินปลายทาง (COD)
              </label>
              {payForm.payment_cod && (
                <div className="ml-6">
                  <Field label="ค่าธรรมเนียม COD" val={payForm.payment_cod_fee} set={v => setPayForm(f => ({ ...f, payment_cod_fee: v }))} ph="ฟรี หรือ 20 บาท" />
                </div>
              )}
            </div>
            {/* Pickup */}
            <div className="bg-gray-50 border border-gray-200/50 rounded-xl p-3">
              <label className="flex items-center gap-2 text-gray-900 text-sm font-medium cursor-pointer">
                <input type="checkbox" checked={payForm.payment_pickup} onChange={e => setPayForm(f => ({ ...f, payment_pickup: e.target.checked }))}
                  className="rounded border-gray-300 bg-white text-blue-500" />
                รับหน้าร้าน (จ่ายเงินสดที่ร้าน)
              </label>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  SUPER ADMIN — Broadcast Page
// ═══════════════════════════════════════════════════════════
function BroadcastPage({ toast }) {
  const [target, setTarget] = useState("all");
  const [message, setMessage] = useState("");
  const [shops, setShops] = useState([]);
  const [selectedShops, setSelectedShops] = useState([]);
  const [sending, setSending] = useState(false);

  useEffect(() => {
    api("/api/shops").then(r => setShops(r.shops || [])).catch(() => {});
  }, []);

  const toggleShop = (id) => {
    setSelectedShops(prev => prev.includes(id) ? prev.filter(s => s !== id) : [...prev, id]);
  };

  const send = async () => {
    if (!message.trim()) { toast("กรุณาพิมพ์ข้อความ", "err"); return; }
    setSending(true);
    const targetCount = target === "all" ? shops.length : selectedShops.length;
    try {
      await api("/api/broadcast", { method: "POST", body: { target, shopIds: selectedShops, message } });
    } catch(e) {}
    toast("ส่งสำเร็จ " + targetCount + " ร้าน", "ok");
    setMessage("");
    setSending(false);
  };

  return (
    <div>
      <h2 className="text-xl font-bold text-gray-900 mb-6">แจ้งเตือน / Broadcast</h2>
      <div className="bg-white border border-gray-200 rounded-xl p-5 max-w-2xl">
        <div className="mb-4">
          <label className="block text-gray-500 text-xs mb-1">ส่งถึง</label>
          <DropdownSelect value={target} onChange={v => setTarget(v)}
            options={[{value:"all",label:"ทุกร้าน (" + shops.length + " ร้าน)"},{value:"selected",label:"เฉพาะร้านที่เลือก"}]} />
        </div>

        {target === "selected" && (
          <div className="mb-4 max-h-40 overflow-y-auto bg-gray-50 border border-gray-200 rounded-lg p-3 space-y-1">
            {shops.map(s => (
              <label key={s.id} className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer hover:text-gray-900 py-1">
                <input type="checkbox" checked={selectedShops.includes(s.id)} onChange={() => toggleShop(s.id)}
                  className="rounded border-gray-300 bg-white text-blue-500 focus:ring-blue-500" />
                {s.name}
              </label>
            ))}
            {shops.length === 0 && <div className="text-gray-400 text-xs">ไม่พบร้านค้า</div>}
          </div>
        )}

        <div className="mb-4">
          <label className="block text-gray-500 text-xs mb-1">ข้อความ</label>
          <textarea value={message} onChange={e => setMessage(e.target.value)}
            placeholder="พิมพ์ข้อความที่ต้องการส่ง..."
            rows={5}
            className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 text-sm outline-none focus:border-blue-500 resize-none" />
        </div>

        <button onClick={send} disabled={sending}
          className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition">
          <Icon d={Icons.bot} size={16} /> {sending ? "กำลังส่ง..." : "ส่งข้อความ"}
        </button>
      </div>
    </div>
  );
}

    <div>

            <thead>
              <tr className="border-b border-gray-200 text-gray-500 text-xs">

                <th className="text-left px-4 py-3">ร้าน</th>
                <th className="text-left px-4 py-3">Platform</th>
                <th className="text-left px-4 py-3">ผู้สนทนา</th>
                <th className="text-left px-4 py-3">ผู้ส่ง</th>
                <th className="text-left px-4 py-3">ข้อความ</th>
              </tr>
            </thead>
            <tbody>
              {logs.length === 0 ? (
                <tr><td colSpan="6" className="text-center py-8 text-gray-400">ยังไม่มีข้อมูล Log</td></tr>
              ) : logs.map((log, i) => (
                <tr key={i} className="border-b border-gray-200/50 hover:bg-gray-50">
                  <td className="px-4 py-3 text-gray-500 text-xs whitespace-nowrap">{log.time}</td>
                  <td className="px-4 py-3 text-gray-900 text-xs">{log.shop}</td>
                  <td className="px-4 py-3">
                    <span className={"text-xs px-2 py-0.5 rounded-full " + (log.platform === "LINE" ? "bg-emerald-100 text-emerald-700 font-medium" : "bg-blue-100 text-blue-700 font-medium")}>
                      {log.platform}
                    </span>
                  </td>
                  <td className="px-4 py-3 text-gray-700 text-xs truncate max-w-[120px]">{log.user_name}</td>
                  <td className="px-4 py-3">
                    {log.direction === "in" ? (
                      <span className="text-xs px-2 py-0.5 rounded bg-gray-100 text-gray-600 font-medium">ลูกค้า</span>
                    ) : (
                      <span className="text-xs px-2 py-0.5 rounded bg-indigo-50 text-indigo-600 font-medium">AI ตอบกลับ</span>
                    )}
                  </td>
                  <td className="px-4 py-3 text-gray-800 text-xs max-w-sm truncate" title={log.message}>{log.message}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  ONBOARDING WIZARD — นำทางร้านค้าใหม่ตั้งค่าระบบ
// ═══════════════════════════════════════════════════════════
function OnboardingWizard({ onComplete }) {
  const [step, setStep] = useState(0);
  const [saving, setSaving] = useState(false);
  const auth = getAuth();
  const shopId = auth.shopId;

  // Step 1: ข้อมูลร้าน
  const [shopData, setShopData] = useState({
    SHOP_NAME: auth.shopName || "", PHONE: "", ADDRESS: "",
    OPEN_HOURS: "", LINE_OA: "", WELCOME_MSG: "สวัสดีครับ! ยินดีต้อนรับ ร้านเรามีสินค้าและบริการหลากหลาย สอบถามได้เลยครับ 😊",
  });

  // Step 2: LINE OA
  const [lineData, setLineData] = useState({ line_token: "", line_bot_id: "", owner_line_id: "" });
  const [lineTest, setLineTest] = useState(null); // null | "ok" | "err"

  // Step 3: สินค้าแรก
  const [product, setProduct] = useState({ name: "", category: "", priceNew: "", stock: "มี" });
  const [productAdded, setProductAdded] = useState(false);

  const STEPS = [
    { title: "ข้อมูลร้าน", desc: "กรอกข้อมูลพื้นฐานของร้านคุณ" },
    { title: "เชื่อม LINE OA", desc: "เชื่อมต่อ LINE Official Account" },
    { title: "เพิ่มสินค้า", desc: "เพิ่มสินค้าหรือบริการแรกของคุณ" },
    { title: "พร้อมใช้งาน!", desc: "ระบบตั้งค่าเสร็จสมบูรณ์" },
  ];

  const saveShopInfo = async () => {
    setSaving(true);
    await api("/api/shopinfo", { method: "PUT", body: { info: shopData } });
    setSaving(false);
    setStep(1);
  };

  const saveLine = async () => {
    if (!lineData.line_token) { setStep(2); return; } // ข้ามได้
    setSaving(true);
    const res = await api("/api/shops/" + shopId + "/line", { method: "PUT", body: lineData });
    setLineTest(res.success ? "ok" : "err");
    setSaving(false);
    if (res.success) setTimeout(() => setStep(2), 800);
  };

  const saveProduct = async () => {
    if (!product.name) { setStep(3); return; } // ข้ามได้
    setSaving(true);
    const res = await api("/api/products", { method: "POST", body: product });
    if (res.success) setProductAdded(true);
    setSaving(false);
    setTimeout(() => setStep(3), 500);
  };

  const finish = async () => {
    setSaving(true);
    await api("/api/onboarding/complete", { method: "POST" });
    setSaving(false);
    onComplete();
  };

  const StepIndicator = () => (
    <div className="flex items-center justify-center gap-1 mb-8">
      {STEPS.map((s, i) => (
        <React.Fragment key={i}>
          <div className={"flex items-center justify-center w-9 h-9 rounded-full text-sm font-bold transition-all " +
            (i < step ? "bg-green-500 text-white" : i === step ? "bg-blue-500 text-white ring-4 ring-blue-500/30" : "bg-gray-100 text-gray-500")}>
            {i < step ? "✓" : i + 1}
          </div>
          {i < STEPS.length - 1 && <div className={"w-8 h-0.5 " + (i < step ? "bg-green-500" : "bg-gray-100")} />}
        </React.Fragment>
      ))}
    </div>
  );

  const Field = ({ label, ph, value, onChange, type }) => (
    <div className="mb-3">
      <label className="block text-gray-500 text-xs mb-1">{label}</label>
      {type === "textarea" ? (
        <textarea value={value} onChange={e => onChange(e.target.value)} placeholder={ph}
          className="w-full bg-gray-100 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-slate-500 focus:outline-none focus:border-blue-500 resize-none" rows={3} />
      ) : (
        <input value={value} onChange={e => onChange(e.target.value)} placeholder={ph}
          className="w-full bg-gray-100 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-slate-500 focus:outline-none focus:border-blue-500" />
      )}
    </div>
  );

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 flex items-center justify-center p-4">
      <div className="w-full max-w-lg">
        {/* Header */}
        <div className="text-center mb-6">
          <div className="text-2xl font-black text-gray-900 mb-1">BOT<span className="text-amber-400">IFY</span></div>
          <div className="text-gray-500 text-sm">ตั้งค่าระบบของคุณใน 4 ขั้นตอน</div>
        </div>

        <StepIndicator />

        <div className="bg-white backdrop-blur border border-gray-200/50 rounded-2xl p-6 shadow-xl">
          {/* Step title */}
          <div className="mb-5">
            <h2 className="text-lg font-bold text-gray-900">{STEPS[step].title}</h2>
            <p className="text-gray-500 text-sm">{STEPS[step].desc}</p>
          </div>

          {/* ── Step 0: ข้อมูลร้าน ── */}
          {step === 0 && (
            <div>
              <Field label="ชื่อร้าน *" ph="ร้าน ABC" value={shopData.SHOP_NAME} onChange={v => setShopData(d => ({ ...d, SHOP_NAME: v }))} />
              <Field label="เบอร์โทร" ph="081-234-5678" value={shopData.PHONE} onChange={v => setShopData(d => ({ ...d, PHONE: v }))} />
              <Field label="ที่อยู่" ph="123 ถ.xxx เขต..." value={shopData.ADDRESS} onChange={v => setShopData(d => ({ ...d, ADDRESS: v }))} />
              <Field label="เวลาทำการ" ph="จ-ศ 9:00-18:00" value={shopData.OPEN_HOURS} onChange={v => setShopData(d => ({ ...d, OPEN_HOURS: v }))} />
              <Field label="LINE OA ID" ph="@shopname" value={shopData.LINE_OA} onChange={v => setShopData(d => ({ ...d, LINE_OA: v }))} />
              <Field label="ข้อความต้อนรับ (Bot จะส่งเมื่อลูกค้าเริ่มแชท)" type="textarea" value={shopData.WELCOME_MSG} onChange={v => setShopData(d => ({ ...d, WELCOME_MSG: v }))} />
              <button onClick={saveShopInfo} disabled={saving || !shopData.SHOP_NAME}
                className="w-full mt-2 py-2.5 rounded-lg text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 disabled:opacity-50 transition">
                {saving ? "กำลังบันทึก..." : "ถัดไป →"}
              </button>
            </div>
          )}

          {/* ── Step 1: เชื่อม LINE OA ── */}
          {step === 1 && (
            <div>
              <div className="bg-blue-500/10 border border-blue-500/30 rounded-lg p-3 mb-4 text-xs text-blue-300 leading-relaxed">
                <p className="font-bold mb-1">วิธีรับ LINE Channel Access Token:</p>
                <p>1. ไปที่ <span className="text-blue-400">LINE Developers Console</span></p>
                <p>2. เลือก Provider → Channel (Messaging API)</p>
                <p>3. แท็บ "Messaging API" → คัดลอก <span className="text-gray-900">Channel Access Token</span></p>
                <p>4. Bot basic ID คือรหัสที่ขึ้นต้นด้วย U...</p>
              </div>
              <Field label="Channel Access Token *" ph="xxxxxxxxxxxxxxx" value={lineData.line_token} onChange={v => setLineData(d => ({ ...d, line_token: v }))} />
              <Field label="Bot User ID" ph="Uxxxxxxxxx" value={lineData.line_bot_id} onChange={v => setLineData(d => ({ ...d, line_bot_id: v }))} />
              <Field label="Owner LINE ID (แจ้งเตือนเจ้าของ)" ph="Uxxxxxxxxx" value={lineData.owner_line_id} onChange={v => setLineData(d => ({ ...d, owner_line_id: v }))} />

              {lineTest === "ok" && <div className="bg-green-500/10 border border-green-500/30 rounded-lg p-2 text-xs text-green-400 mb-3 text-center">✅ เชื่อมต่อสำเร็จ!</div>}
              {lineTest === "err" && <div className="bg-red-500/10 border border-red-500/30 rounded-lg p-2 text-xs text-red-400 mb-3 text-center">❌ เชื่อมต่อไม่สำเร็จ ตรวจสอบ Token</div>}

              <div className="flex gap-2 mt-2">
                <button onClick={() => setStep(0)} className="flex-1 py-2.5 rounded-lg text-sm font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition">
                  ← ย้อนกลับ
                </button>
                <button onClick={saveLine} disabled={saving}
                  className="flex-1 py-2.5 rounded-lg text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 disabled:opacity-50 transition">
                  {saving ? "กำลังเชื่อมต่อ..." : lineData.line_token ? "เชื่อมต่อ & ถัดไป →" : "ข้ามขั้นตอนนี้ →"}
                </button>
              </div>
            </div>
          )}

          {/* ── Step 2: เพิ่มสินค้า ── */}
          {step === 2 && (
            <div>
              {productAdded ? (
                <div className="text-center py-4">
                  <div className="text-4xl mb-2">🎉</div>
                  <div className="text-green-400 font-bold">เพิ่มสินค้าแรกสำเร็จ!</div>
                  <p className="text-gray-500 text-xs mt-1">เพิ่มสินค้าเพิ่มเติมได้ในหน้า "สินค้า" ภายหลัง</p>
                </div>
              ) : (
                <div>
                  <Field label="ชื่อสินค้า / บริการ *" ph="เช่น เสื้อยืด Cotton, บริการล้างแอร์..." value={product.name} onChange={v => setProduct(d => ({ ...d, name: v }))} />
                  <div className="grid grid-cols-2 gap-3">
                    <Field label="หมวดหมู่" ph="เสื้อผ้า, อาหาร..." value={product.category} onChange={v => setProduct(d => ({ ...d, category: v }))} />
                    <Field label="ราคา (บาท)" ph="590" value={product.priceNew} onChange={v => setProduct(d => ({ ...d, priceNew: v }))} />
                  </div>
                  <div className="bg-gray-100/30 rounded-lg p-3 mt-1 mb-3 text-xs text-gray-500">
                    💡 เพิ่มแค่ 1 รายการก่อน — เพิ่มเพิ่มเติมได้ทีหลังในหน้า "สินค้า" หรือ import จาก Google Sheet
                  </div>
                </div>
              )}
              <div className="flex gap-2 mt-2">
                <button onClick={() => setStep(1)} className="flex-1 py-2.5 rounded-lg text-sm font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition">
                  ← ย้อนกลับ
                </button>
                <button onClick={productAdded ? () => setStep(3) : saveProduct} disabled={saving}
                  className="flex-1 py-2.5 rounded-lg text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 disabled:opacity-50 transition">
                  {saving ? "กำลังเพิ่ม..." : productAdded ? "ถัดไป →" : product.name ? "เพิ่มสินค้า & ถัดไป →" : "ข้ามขั้นตอนนี้ →"}
                </button>
              </div>
            </div>
          )}

          {/* ── Step 3: เสร็จสิ้น ── */}
          {step === 3 && (
            <div className="text-center py-2">
              <div className="text-5xl mb-3">🚀</div>
              <h3 className="text-xl font-bold text-gray-900 mb-2">ระบบพร้อมใช้งานแล้ว!</h3>
              <p className="text-gray-500 text-sm mb-5">สิ่งที่ตั้งค่าเรียบร้อย:</p>

              <div className="text-left space-y-2 mb-6">
                <div className="flex items-center gap-2 text-sm">
                  <span className={shopData.SHOP_NAME ? "text-green-400" : "text-slate-500"}>{shopData.SHOP_NAME ? "✅" : "⏭️"}</span>
                  <span className="text-gray-700">ข้อมูลร้าน{shopData.SHOP_NAME ? ": " + shopData.SHOP_NAME : " (ข้าม)"}</span>
                </div>
                <div className="flex items-center gap-2 text-sm">
                  <span className={lineData.line_token ? "text-green-400" : "text-slate-500"}>{lineData.line_token ? "✅" : "⏭️"}</span>
                  <span className="text-gray-700">LINE OA{lineData.line_token ? " เชื่อมต่อแล้ว" : " (ยังไม่ได้เชื่อม — ตั้งค่าภายหลังได้)"}</span>
                </div>
                <div className="flex items-center gap-2 text-sm">
                  <span className={productAdded ? "text-green-400" : "text-slate-500"}>{productAdded ? "✅" : "⏭️"}</span>
                  <span className="text-gray-700">สินค้า{productAdded ? ": " + product.name : " (ยังไม่ได้เพิ่ม — เพิ่มภายหลังได้)"}</span>
                </div>
              </div>

              <div className="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 mb-5 text-xs text-amber-300 text-left">
                <p className="font-bold mb-1">💡 สิ่งที่ควรทำต่อ:</p>
                <p>• เพิ่มสินค้าเพิ่มเติมในหน้า "สินค้า"</p>
                <p>• ตั้ง Webhook URL ใน LINE Developers: <span className="text-gray-900">https://yourdomain.com/webhook</span></p>
                <p>• ทดสอบส่งข้อความหา LINE OA ของคุณ</p>
                <p>• ตั้งค่าวิธีชำระเงินในหน้า "ข้อมูลร้าน"</p>
              </div>

              <div className="flex gap-2">
                <button onClick={() => setStep(2)} className="flex-1 py-2.5 rounded-lg text-sm font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition">
                  ← ย้อนกลับ
                </button>
                <button onClick={finish} disabled={saving}
                  className="flex-1 py-3 rounded-lg text-sm font-bold text-white bg-green-600 hover:bg-green-500 disabled:opacity-50 transition shadow-lg shadow-green-600/20">
                  {saving ? "กำลังบันทึก..." : "🎉 เข้าสู่ Dashboard"}
                </button>
              </div>
            </div>
          )}
        </div>

        {/* Skip link */}
        {step < 3 && (
          <div className="text-center mt-4">
            <button onClick={finish} className="text-xs text-gray-400 hover:text-gray-700 underline transition">
              ข้ามทั้งหมด — เข้า Dashboard เลย
            </button>
          </div>
        )}
      </div>
    </div>
  );
}
