// ── Utility ─────────────────────────────────────────────
// ── Realtime Manager ──────────────────────────────────────
const RealtimeManager = {
  client: null,
  async init() {
    if (this.client) return this.client;
    try {
      const res = await fetch(API_BASE + "/api/auth/config").then(r => r.json());
      if (res.supabaseUrl && res.supabaseAnonKey && window.supabase) {
        this.client = window.supabase.createClient(res.supabaseUrl, res.supabaseAnonKey);
      }
    } catch(e) { console.error("Failed to init supabase realtime:", e); }
    return this.client;
  }
};

// ── Token Refresh Manager ──────────────────────────────────
const TokenManager = {
  _refreshTimer: null,
  _isRefreshing: false,
  _refreshPromise: null,

  // เริ่ม auto-refresh timer
  startAutoRefresh() {
    this.stopAutoRefresh();
    const expiresAt = Number(sessionStorage.getItem("botify_expires_at") || 0);
    if (!expiresAt) return;
    // refresh 5 นาทีก่อนหมดอายุ
    const refreshAt = (expiresAt * 1000) - Date.now() - (5 * 60 * 1000);
    if (refreshAt <= 0) {
      // token ใกล้หมดแล้ว → refresh ทันที
      this.refresh();
    } else {
      this._refreshTimer = setTimeout(() => this.refresh(), refreshAt);
    }
  },

  stopAutoRefresh() {
    if (this._refreshTimer) { clearTimeout(this._refreshTimer); this._refreshTimer = null; }
  },

  // Refresh token
  async refresh() {
    // ป้องกันเรียกซ้ำพร้อมกัน
    if (this._isRefreshing) return this._refreshPromise;
    const refreshToken = sessionStorage.getItem("botify_refresh_token");
    if (!refreshToken) return null;

    this._isRefreshing = true;
    this._refreshPromise = fetch(API_BASE + "/api/auth/refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refreshToken }),
    })
    .then(r => r.json())
    .then(res => {
      if (res.success && res.access_token) {
        sessionStorage.setItem("botify_token", res.access_token);
        sessionStorage.setItem("botify_refresh_token", res.refresh_token);
        sessionStorage.setItem("botify_expires_at", String(res.expires_at));
        sessionStorage.setItem("botify_role", res.role);
        if (res.displayName) sessionStorage.setItem("botify_display", res.displayName);
        if (res.shopId) sessionStorage.setItem("botify_shop_id", res.shopId);
        if (res.shopName) sessionStorage.setItem("botify_shop_name", res.shopName);
        this.startAutoRefresh(); // ตั้ง timer ใหม่
        return res;
      }
      return null; // refresh ไม่สำเร็จ
    })
    .catch(() => null)
    .finally(() => { this._isRefreshing = false; this._refreshPromise = null; });

    return this._refreshPromise;
  },
};

function api(path, opts = {}) {
  const token = sessionStorage.getItem("botify_token") || "";
  const key = sessionStorage.getItem("botify_key") || "";
  const authHeader = token ? { Authorization: "Bearer " + token } : key ? { "x-api-key": key } : {};
  return fetch(API_BASE + path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...authHeader, ...opts.headers },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  }).then(async r => {
    if (r.status === 401 && token) {
      // Token หมดอายุ → ลอง refresh ก่อน
      const refreshed = await TokenManager.refresh();
      if (refreshed) {
        // Retry request ด้วย token ใหม่
        const newToken = sessionStorage.getItem("botify_token");
        return fetch(API_BASE + path, {
          ...opts,
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + newToken, ...opts.headers },
          body: opts.body ? JSON.stringify(opts.body) : undefined,
        }).then(r2 => {
          if (r2.status === 401) { sessionStorage.clear(); TokenManager.stopAutoRefresh(); window.location.reload(); }
          return r2.json();
        });
      }
      // Refresh ไม่ได้ → logout
      sessionStorage.clear(); TokenManager.stopAutoRefresh(); window.location.reload();
    }
    return r.json();
  });
}

function getAuth() {
  try {
    return {
      role: sessionStorage.getItem("botify_role") || "shop_owner",
      displayName: sessionStorage.getItem("botify_display") || "",
      shopId: sessionStorage.getItem("botify_shop_id") || null,
      shopName: sessionStorage.getItem("botify_shop_name") || "",
      email: sessionStorage.getItem("botify_email") || "",
      username: sessionStorage.getItem("botify_display") || sessionStorage.getItem("botify_email") || "",
    };
  } catch(e) { return { role: "shop_owner" }; }
}

function Toast({ msg, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, [onClose]);
  return (
    <div className={"fixed top-4 right-4 z-50 px-5 py-3 rounded-xl shadow-lg text-white text-sm font-medium transition-all " + (type === "ok" ? "bg-emerald-600" : "bg-red-500")}>
      {msg}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  LOGIN SCREEN
// ═══════════════════════════════════════════════════════════
function LoginScreen({ onLogin }) {
  const [mode, setMode] = useState("shop");
  const [view, setView] = useState("login"); // "login" | "register" | "forgot"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [key, setKey] = useState("");
  const [regName, setRegName] = useState("");
  const [regShop, setRegShop] = useState("");
  const [regPhone, setRegPhone] = useState("");
  const [err, setErr] = useState("");
  const [successMsg, setSuccessMsg] = useState("");
  const [loading, setLoading] = useState(false);
  const [showPw, setShowPw] = useState(false);
  const [showKey, setShowKey] = useState(false);
  const [acceptTos, setAcceptTos] = useState(false);

  const EyeIcon = ({ show, toggle }) => (
    <button type="button" onClick={toggle}
      style={{ position: "absolute", right: "12px", top: "50%", transform: "translateY(-50%)", cursor: "pointer", background: "none", border: "none", padding: "4px", color: "#6b7280" }}>
      {show ? (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
          <line x1="1" y1="1" x2="23" y2="23" />
        </svg>
      ) : (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      )}
    </button>
  );

  const tryLogin = async () => {
    setLoading(true); setErr(""); setSuccessMsg("");
    try {
      let body;
      if (mode === "admin") {
        if (!key.trim()) { setErr("กรุณากรอก API Key"); setLoading(false); return; }
        body = { mode: "admin", apiKey: key.trim() };
      } else {
        if (!email.trim() || !password) { setErr("กรุณากรอก email และ password"); setLoading(false); return; }
        body = { email: email.trim(), password };
      }
      const res = await fetch(API_BASE + "/api/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      }).then(r => r.json());

      if (res.success && res.access_token) {
        sessionStorage.setItem("botify_token", res.access_token);
        sessionStorage.setItem("botify_refresh_token", res.refresh_token || "");
        sessionStorage.setItem("botify_expires_at", String(res.expires_at || 0));
        sessionStorage.setItem("botify_role", res.role);
        sessionStorage.setItem("botify_display", res.displayName || "");
        sessionStorage.setItem("botify_shop_id", res.shopId || "");
        sessionStorage.setItem("botify_shop_name", res.shopName || "");
        sessionStorage.setItem("botify_email", email.trim());
        TokenManager.startAutoRefresh();
        onLogin();
      } else if (res.success && res.mode === "apikey") {
        sessionStorage.setItem("botify_key", key.trim());
        sessionStorage.setItem("botify_role", "superadmin");
        sessionStorage.setItem("botify_display", "Super Admin");
        onLogin();
      } else {
        setErr(res.error || "เข้าสู่ระบบไม่สำเร็จ");
      }
    } catch(e) { setErr("เชื่อมต่อ Server ไม่ได้"); }
    setLoading(false);
  };

  const tryRegister = async () => {
    setLoading(true); setErr(""); setSuccessMsg("");
    try {
      if (!acceptTos) {
        setErr("กรุณายอมรับข้อกำหนดการใช้งานและนโยบายความเป็นส่วนตัว"); setLoading(false); return;
      }
      if (!email.trim() || !password || !regShop.trim()) {
        setErr("กรุณากรอก email, password และชื่อร้าน"); setLoading(false); return;
      }
      if (password.length < 6) {
        setErr("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร"); setLoading(false); return;
      }
      const res = await fetch(API_BASE + "/api/auth/register", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.trim(), password, displayName: regName.trim() || email.trim(), shopName: regShop.trim(), phone: regPhone.trim() }),
      }).then(r => r.json());

      if (res.success) {
        setSuccessMsg("สมัครสำเร็จ! กำลังเข้าสู่ระบบ...");
        // Auto-login after register
        setTimeout(async () => {
          const loginRes = await fetch(API_BASE + "/api/auth/login", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email.trim(), password }),
          }).then(r => r.json());
          if (loginRes.success && loginRes.access_token) {
            sessionStorage.setItem("botify_token", loginRes.access_token);
            sessionStorage.setItem("botify_refresh_token", loginRes.refresh_token || "");
            sessionStorage.setItem("botify_expires_at", String(loginRes.expires_at || 0));
            sessionStorage.setItem("botify_role", loginRes.role);
            sessionStorage.setItem("botify_display", loginRes.displayName || "");
            sessionStorage.setItem("botify_shop_id", loginRes.shopId || "");
            sessionStorage.setItem("botify_shop_name", loginRes.shopName || "");
            sessionStorage.setItem("botify_email", email.trim());
            TokenManager.startAutoRefresh();
            onLogin();
          } else {
            setView("login"); setSuccessMsg("สมัครสำเร็จ! กรุณาเข้าสู่ระบบ");
          }
          setLoading(false);
        }, 500);
        return;
      } else {
        setErr(res.error || "สมัครไม่สำเร็จ");
      }
    } catch(e) { setErr("เชื่อมต่อ Server ไม่ได้"); }
    setLoading(false);
  };

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 flex items-center justify-center p-4">
      <div className="w-full max-w-sm">
        <div className="text-center mb-10">
          <div className="text-5xl font-black tracking-widest text-white mb-2 drop-shadow-lg">

          </div>
          <div className="text-slate-400 text-sm font-medium tracking-wide">
            {view === "register" ? "สมัครสมาชิก" : view === "forgot" ? "ลืมรหัสผ่าน" : "Admin Dashboard"}
          </div>
        </div>
        <div className="bg-white backdrop-blur border border-gray-200 rounded-2xl p-6">

          {view === "forgot" ? (
            <>
              <p className="text-gray-500 text-xs mb-4">กรอกอีเมลที่ใช้สมัคร แล้วเราจะส่งลิงก์รีเซ็ตรหัสผ่านให้</p>
              <label className="block text-gray-500 text-xs mb-1">Email</label>
              <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter") {
                  setLoading(true); setErr(""); setSuccessMsg("");
                  fetch(API_BASE + "/api/auth/forgot-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email.trim() }) })
                    .then(r => r.json()).then(r => { if (r.success) setSuccessMsg(r.message); else setErr(r.error || "เกิดข้อผิดพลาด"); })
                    .catch(() => setErr("เชื่อมต่อ Server ไม่ได้")).finally(() => setLoading(false));
                }}}
                placeholder="อีเมลของคุณ" autoComplete="email"
                className="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-gray-900 text-sm outline-none focus:border-blue-500 transition mb-4" />
              {err && <div className="text-red-400 text-xs mb-3">{err}</div>}
              {successMsg && <div className="text-emerald-400 text-xs mb-3">{successMsg}</div>}
              <button onClick={() => {
                setLoading(true); setErr(""); setSuccessMsg("");
                fetch(API_BASE + "/api/auth/forgot-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email.trim() }) })
                  .then(r => r.json()).then(r => { if (r.success) setSuccessMsg(r.message); else setErr(r.error || "เกิดข้อผิดพลาด"); })
                  .catch(() => setErr("เชื่อมต่อ Server ไม่ได้")).finally(() => setLoading(false));
              }} disabled={loading || !email.trim()}
                className="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold py-3 rounded-xl transition mb-3">
                {loading ? "กำลังส่ง..." : "📧 ส่งลิงก์รีเซ็ตรหัสผ่าน"}
              </button>
              <div className="text-center">
                <button onClick={() => { setView("login"); setErr(""); setSuccessMsg(""); }}
                  className="text-gray-500 hover:text-blue-400 text-xs transition">
                  ← กลับหน้า Login
                </button>
              </div>
            </>
          ) : view === "register" ? (
            <>
              <label className="block text-gray-500 text-xs mb-1">Email</label>
              <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                placeholder="อีเมลของคุณ" autoComplete="email"
                className="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-gray-900 text-sm outline-none focus:border-emerald-500 transition mb-3" />
              <label className="block text-gray-500 text-xs mb-1">Password</label>

              <label className="block text-gray-500 text-xs mb-1">ชื่อร้านค้า <span className="text-red-400">*</span></label>
              <input type="text" value={regShop} onChange={e => setRegShop(e.target.value)}
                placeholder="ชื่อร้านค้าของคุณ"
                className="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-gray-900 text-sm outline-none focus:border-emerald-500 transition mb-3" />
              <label className="block text-gray-500 text-xs mb-1">เบอร์โทร</label>
              <input type="tel" value={regPhone} onChange={e => setRegPhone(e.target.value)}

              <label className="flex items-start gap-2 mb-4 cursor-pointer">
                <input type="checkbox" checked={acceptTos} onChange={e => setAcceptTos(e.target.checked)}
                  className="mt-0.5 accent-emerald-500" style={{ width: "16px", height: "16px", flexShrink: 0 }} />

// ── Smooth Bezier Area Chart (ภาษาไทย) ──
function SmoothAreaChart({ chartData }) {
  if (!chartData || !chartData.labels) {
    return <div className="w-full h-[200px] flex items-center justify-center text-gray-400 text-xs">กำลังโหลดกราฟ...</div>;
  }
  const labels = chartData.labels;
  
  const ds = [
    { id: 'chat',  label: 'ปริมาณแชท', color: '#f59e0b', fill: 'rgba(245,158,11,0.08)',  data: chartData.chatData },
    { id: 'bot',   label: 'Bot จัดการ',  color: '#06b6d4', fill: 'rgba(6,182,212,0.08)',   data: chartData.botData },
    { id: 'order', label: 'ออเดอร์',     color: '#8b5cf6', fill: 'rgba(139,92,246,0.07)',  data: chartData.orderData },
  ];
  const W = 800, H = 200, PL = 48, PR = 20, PT = 16, PB = 32;
  const cW = W - PL - PR, cH = H - PT - PB;
  const allVals = ds.flatMap(d => d.data);
  const minV = 0, maxV = Math.max(10, Math.max(...allVals) * 1.08);
  const toX = i => PL + (i / (labels.length - 1)) * cW;
  const toY = v => PT + cH - ((v - minV) / (maxV - minV)) * cH;
  const smooth = pts => {
    if (pts.length < 2) return `M${pts[0][0]},${pts[0][1]}`;
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const cpx = (pts[i][0] + pts[i+1][0]) / 2;
      d += ` C${cpx},${pts[i][1]} ${cpx},${pts[i+1][1]} ${pts[i+1][0]},${pts[i+1][1]}`;
    }
    return d;
  };
  const fmtVal = v => v >= 1000 ? (v/1000).toFixed(1).replace(/\.0$/,'') + 'พัน' : String(v);
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => ({
    y: toY(minV + f * (maxV - minV)),
    label: fmtVal(Math.round((minV + f * (maxV - minV))))
  }));
  const [hover, setHover] = React.useState(null);
  return (
    <div style={{ position: 'relative' }}>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ overflow: 'visible', display: 'block' }}>
        <defs>
          {ds.map(d => (
            <linearGradient key={d.id} id={`fill_${d.id}`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={d.color} stopOpacity="0.18" />
              <stop offset="100%" stopColor={d.color} stopOpacity="0" />
            </linearGradient>
          ))}
        </defs>
        {/* เส้นตาราง */}
        {gridLines.map((g, gi) => (
          <g key={gi}>
            <line x1={PL} y1={g.y} x2={W - PR} y2={g.y} stroke="#f3f4f6" strokeWidth="1" />
            <text x={PL - 6} y={g.y + 4} textAnchor="end" fontSize="9" fill="#d1d5db">{g.label}</text>
          </g>
        ))}
        {/* พื้นที่ใต้เส้น */}
        {ds.map(d => {
          const pts = d.data.map((v, i) => [toX(i), toY(v)]);
          const line = smooth(pts);
          const area = line + ` L${toX(11)},${toY(0)} L${toX(0)},${toY(0)} Z`;
          return <path key={d.id+"a"} d={area} fill={`url(#fill_${d.id})`} />;
        })}
        {/* เส้นกราฟ */}
        {ds.map(d => {
          const pts = d.data.map((v, i) => [toX(i), toY(v)]);
          return <path key={d.id+"l"} d={smooth(pts)} fill="none" stroke={d.color} strokeWidth="2" strokeLinejoin="round" />;
        })}
        {/* เส้นแนวตั้งเมื่อ hover */}
        {hover !== null && (
          <>
            <line x1={toX(hover)} y1={PT} x2={toX(hover)} y2={PT + cH} stroke="#e5e7eb" strokeWidth="1" strokeDasharray="3 3" />
            {ds.map(d => (
              <circle key={d.id} cx={toX(hover)} cy={toY(d.data[hover])} r="4" fill={d.color} stroke="#fff" strokeWidth="2" />
            ))}
          </>
        )}
        {/* แกน X */}
        {labels.map((m, i) => (
          <text key={m} x={toX(i)} y={H - 6} textAnchor="middle" fontSize="9.5" fill="#9ca3af">{m}</text>
        ))}
        {/* พื้นที่โปร่งสำหรับ hover */}
        {labels.map((m, i) => (
          <rect key={m+"h"} x={toX(i) - (cW/(labels.length-1))/2} y={PT} width={cW/(labels.length-1)} height={cH}
            fill="transparent" onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} />
        ))}
      </svg>
      {/* Tooltip เมื่อ hover */}
      {hover !== null && (
        <div style={{ position: 'absolute', top: 10, left: Math.min(toX(hover) / W * 100, 75) + '%', background: '#fff', border: '1px solid #e5e7eb', borderRadius: 10, padding: '10px 14px', boxShadow: '0 4px 20px rgba(0,0,0,0.10)', pointerEvents: 'none', minWidth: 170, transform: 'translateX(-50%)' }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: '#374151', marginBottom: 6 }}>ช่วง: {labels[hover]}</div>
          {ds.map(d => (
            <div key={d.id} style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
              <div style={{ width: 8, height: 8, borderRadius: '50%', background: d.color }} />
              <span style={{ fontSize: 11, color: '#6b7280' }}>{d.label}:</span>
              <span style={{ fontSize: 11, fontWeight: 700, color: '#111827', marginLeft: 'auto' }}>{d.data[hover].toLocaleString()} ครั้ง</span>
            </div>
          ))}
          <div style={{ marginTop: 6, paddingTop: 6, borderTop: '1px solid #f3f4f6', fontSize: 10, color: '#9ca3af' }}>จากข้อมูลจริง</div>
        </div>
      )}
    </div>
  );
}

function StatsPage({ onNavigate }) {
  const [stats, setStats] = React.useState(null);
  const [refreshing, setRefreshing] = React.useState(false);
  const [recentOrders, setRecentOrders] = React.useState([]);
  const [recentChats, setRecentChats] = React.useState([]);
  const [chartPeriod, setChartPeriod] = React.useState('รายเดือน');
  const [chartData, setChartData] = React.useState(null);

  const loadChart = React.useCallback(() => {
    api(`/api/analytics/chart?period=${encodeURIComponent(chartPeriod)}`).then(d => {
      setChartData(d);
    }).catch(() => setChartData(null));
  }, [chartPeriod]);

  useEffect(() => { loadChart(); }, [loadChart]);

  const load = useCallback(() => { 
    setRefreshing(true); 
    Promise.all([
      api("/api/stats").catch(() => null),
      api("/api/orders?limit=5").catch(() => ({ orders: [] })),
      api("/api/chats?limit=5").catch(() => ({ chats: [] }))
    ]).then(([s, o, c]) => {
      if (s) {
        setStats(s);
      } else {
        setStats({ totalOrders: 0, pendingOrders: 0, todayMsgs: 0, activeBots: 0, orderStats: {} });
      }
      
      setRecentOrders((o?.orders || []).map(r => ({
        id: r.orderId || `#${r.rowIndex}`,
        customer: (r.platform || 'LINE') + ': ' + (r.name || 'ลูกค้า'),
        item: r.product || 'สินค้า',
        amount: r.qty ? `${r.qty} ชิ้น` : '-',
        status: r.status || 'รอยืนยัน',
        sc: r.status === 'รอยืนยัน' ? '#f59e0b' : (r.status === 'จัดส่งแล้ว' ? '#10b981' : '#3b82f6')
      })));

      setRecentChats((c?.chats || []).map(ch => {
        const diffMs = Date.now() - new Date(ch.created_at).getTime();
        const diffM = Math.floor(diffMs / 60000);
        return {
          name: ch.user_name || 'ไม่ระบุชื่อ',
          msg: ch.message || '',
          time: diffM < 60 ? `${diffM}m` : `${Math.floor(diffM/60)}h`,
          via: ch.platform === 'facebook' ? 'Facebook' : 'LINE',
          replied: ch.direction === 'out'
        };
      }));

      setRefreshing(false);
    }).catch(() => setRefreshing(false));
  }, []);

  useEffect(() => { load(); }, [load]);

  // Supabase Realtime Subscription
  useEffect(() => {
    let channel = null;
    const shopId = sessionStorage.getItem("botify_shop_id");
    
    RealtimeManager.init().then(client => {
      if (!client) return;
      channel = client.channel('dashboard-stats')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
          if (shopId && payload.new && payload.new.workspace_id && payload.new.workspace_id !== shopId) return;
          load();
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_logs' }, payload => {
          if (shopId && payload.new && payload.new.workspace_id && payload.new.workspace_id !== shopId) return;
          load();
        })
        .subscribe();

    return () => {
      if (channel) {

  if (!stats) return <Loader />;

        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div>
            <div className="text-[13px] sm:text-[15px] font-bold text-gray-900">ปริมาณแชทและออเดอร์</div>
            <div className="text-[10px] sm:text-[12px] text-gray-400 mt-0.5">จำนวนการสนทนา · ยอดสั่งซื้อ</div>
          </div>
          <div className="flex flex-wrap items-center gap-2 sm:gap-4">
            {[{ l: 'ปริมาณแชท', c: '#f59e0b' }, { l: 'Bot จัดการ', c: '#06b6d4' }, { l: 'ออเดอร์', c: '#8b5cf6' }].map(item => (
              <div key={item.l} className="flex items-center gap-1">
                <div className="w-2 h-2 rounded-full" style={{ background: item.c }} />
                <span className="text-[9px] sm:text-[11px] text-gray-500">{item.l}</span>
              </div>
            ))}
            <button onClick={() => setChartPeriod(chartPeriod === 'รายเดือน' ? 'รายสัปดาห์' : 'รายเดือน')}
              className="flex items-center gap-1 px-2.5 py-1 sm:px-3 sm:py-1.5 bg-gray-50 border border-gray-200 rounded-lg text-[10px] sm:text-xs text-gray-500 transition-colors hover:bg-gray-100 ml-auto sm:ml-0">
              {chartPeriod} ▾
            </button>
          </div>
        </div>
        <SmoothAreaChart chartData={chartData} />
      </div>

      {/* Bottom Row: Recent Orders + Recent Chats */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 pb-10">
        
        {/* Recent Orders */}
        <div style={cardStyle}>
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-2">
              <div className="w-7 h-7 rounded-lg bg-blue-50 text-blue-500 flex items-center justify-center">
                <Icon d={Icons.cart} size={14} />
              </div>
              <span className="text-xs sm:text-sm font-bold text-gray-900">ออเดอร์ล่าสุด</span>
            </div>
            <button onClick={() => onNavigate && onNavigate('orders')}
              className="text-[10px] sm:text-xs text-blue-500 font-bold hover:underline">ดูทั้งหมด →</button>
          </div>
          {recentOrders.length > 0 ? recentOrders.map((o, i) => (
            <div key={o.id} className="flex items-center gap-2.5 py-2.5 border-b border-gray-100 last:border-0">
              <div className="w-9 h-9 rounded-xl bg-gray-50 flex items-center justify-center shrink-0">
                <span className="text-[9px] font-black text-gray-500">{o.id}</span>
              </div>
              <div className="flex-1 min-w-0">
                <div className="text-[11px] sm:text-xs font-bold text-gray-900 truncate">{o.customer}</div>
                <div className="text-[10px] text-gray-500 truncate">{o.item}</div>
              </div>
              <div className="text-right shrink-0">
                <div className="text-xs sm:text-[13px] font-bold text-gray-900">{o.amount}</div>
                <span className="inline-block mt-0.5 text-[9px] font-bold px-2 py-0.5 rounded-full" style={{ color: o.sc, background: o.sc + '15' }}>{o.status}</span>
              </div>
            </div>
          )) : (
            <div className="text-center py-6 text-xs text-gray-400">ไม่มีรายการสั่งซื้อล่าสุด</div>
          )}
        </div>

        {/* Recent Chats */}
        <div style={cardStyle}>
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-2">
              <div className="w-7 h-7 rounded-lg bg-purple-50 text-purple-500 flex items-center justify-center">
                <Icon d={Icons.chat} size={14} />
              </div>
              <span className="text-xs sm:text-sm font-bold text-gray-900">การสนทนาล่าสุด</span>
            </div>
            <button onClick={() => onNavigate && onNavigate('chats')}
              className="text-[10px] sm:text-xs text-blue-500 font-bold hover:underline">ดูทั้งหมด →</button>
          </div>
          
          {/* Order status mini bar */}
          {stats?.orderStats && stats.totalOrders > 0 && (
            <div className="bg-gray-50 rounded-xl p-2.5 mb-3 flex gap-2">
              {[
                {l:'ส่งแล้ว',v:Math.round((stats.orderStats['ส่งแล้ว']||0)/stats.totalOrders*100),c:'#10b981'},
                {l:'จัดส่ง',v:Math.round((stats.orderStats['จัดส่ง']||0)/stats.totalOrders*100),c:'#3b82f6'},
                {l:'รอ',v:Math.round((stats.orderStats['รอ']||0)/stats.totalOrders*100),c:'#f59e0b'},
                {l:'ยกเลิก',v:Math.round((stats.orderStats['ยกเลิก']||0)/stats.totalOrders*100),c:'#ef4444'}
              ].map(s => (
                <div key={s.l} className="flex-1">
                  <div className="flex justify-between mb-1">
                    <span className="text-[8px] sm:text-[9px] text-gray-500">{s.l}</span>
                    <span className="text-[8px] sm:text-[9px] font-bold text-gray-900">{s.v}%</span>
                  </div>
                  <div className="h-1 rounded-full bg-gray-200">
                    <div className="h-full rounded-full" style={{ width: s.v+'%', background: s.c }} />
                  </div>
                </div>
              ))}
            </div>
          )}
          
          {recentChats.length > 0 ? recentChats.map((c, i) => (
            <div key={i} className="flex items-center gap-2.5 py-2.5 border-b border-gray-100 last:border-0">
              <div className="w-8 h-8 rounded-full flex items-center justify-center text-[10px] font-black text-white shrink-0" 
                   style={{ background: c.via==='LINE' ? '#06c755' : '#1877f2' }}>
                {c.via==='LINE' ? 'L' : 'F'}
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] sm:text-xs font-bold text-gray-900 truncate">{c.name}</span>
                  <span className="text-[9px] text-gray-400 shrink-0">{c.time} ago</span>
                </div>
                <div className="text-[10px] sm:text-[11px] text-gray-500 truncate">{c.msg}</div>
              </div>
              <span className="shrink-0 text-[8px] sm:text-[9px] font-bold px-2 py-0.5 rounded-full" 
                    style={{ color: c.replied ? '#10b981' : '#f59e0b', background: c.replied ? '#f0fdf4' : '#fffbeb' }}>
                {c.replied ? 'Bot ตอบ' : 'รอตอบ'}
              </span>
            </div>
          )) : (
            <div className="text-center py-6 text-xs text-gray-400">ไม่มีการสนทนาล่าสุด</div>
          )}
        </div>
      </div>
    </div>
  );
}


// ═══════════════════════════════════════════════════════════
//  SHOP SETTINGS
// ═══════════════════════════════════════════════════════════
function ShopSettings({ toast }) {
  const [info, setInfo] = useState(null);
  const [saving, setSaving] = useState(false);
  const [activeTab, setActiveTab] = useState("general");
  const [pay, setPay] = useState(null);
  const [savingPay, setSavingPay] = useState(false);
  // Slug state
  const [slugData, setSlugData] = useState({ slug: "", url: "" });
  const [slugInput, setSlugInput] = useState("");
  const [slugChecking, setSlugChecking] = useState(false);
  const [slugAvailable, setSlugAvailable] = useState(null);
  const [savingSlug, setSavingSlug] = useState(false);
  const [slugCopied, setSlugCopied] = useState(false);

  const auth = getAuth();
  const shopId = auth.shopId;

  useEffect(() => {
    api("/api/shopinfo").then(d => setInfo(d.info || {})).catch(() => {});
    api("/api/slug").then(d => {
      if (d.success) { setSlugData(d); setSlugInput(d.slug || ""); }
    }).catch(() => {});
    if (shopId) {
      api("/api/shops").then(r => {
        const shop = (r.shops || []).find(s => s.id === shopId);
        if (shop) setPay({
          payment_transfer: shop.payment_transfer !== false,
          payment_promptpay: shop.payment_promptpay || "",
          payment_bank_name: shop.payment_bank_name || "",
          payment_bank_account: shop.payment_bank_account || "",
          payment_bank_acc_name: shop.payment_bank_acc_name || "",
          payment_cod: !!shop.payment_cod,
          payment_cod_fee: shop.payment_cod_fee || "",
          payment_pickup: !!shop.payment_pickup,
        });
      }).catch(() => {});
    }
  }, [shopId]);

  // Slug check debounce
  useEffect(() => {
    if (!slugInput || slugInput.length < 3 || slugInput === slugData.slug) {
      setSlugAvailable(null); return;
    }
    setSlugChecking(true);
    const t = setTimeout(() => {
      fetch("/api/slug/check/" + encodeURIComponent(slugInput))
        .then(r => r.json())
        .then(d => { setSlugAvailable(d.available); setSlugChecking(false); })
        .catch(() => setSlugChecking(false));
    }, 500);
    return () => clearTimeout(t);
  }, [slugInput]);

  const save = async () => {
    setSaving(true);
    const res = await api("/api/shopinfo", { method: "PUT", body: { info } });
    toast(res.success ? "บันทึกข้อมูลร้านแล้ว" : "เกิดข้อผิดพลาด", res.success ? "ok" : "err");
    setSaving(false);
  };

  const savePayment = async () => {
    if (!shopId) { toast("ไม่พบ shop ID", "err"); return; }
    setSavingPay(true);
    const res = await api("/api/shops/" + shopId + "/payment", { method: "PUT", body: pay });
    toast(res.success ? "บันทึกวิธีชำระเงินสำเร็จ" : ("บันทึกไม่สำเร็จ: " + (res.error || "ไม่ทราบสาเหตุ")), res.success ? "ok" : "err");
    setSavingPay(false);
  };

  if (!info) return <Loader />;

  const fields = [
    { key: "SHOP_NAME", label: "ชื่อร้าน", ph: "ร้าน ABC" },
    { key: "LOGO", label: "ลิงก์รูปภาพโลโก้ร้านค้า (สำหรับแสดงบนหัวเอกสารการขาย)", ph: "เช่น https://..." },
    { key: "PHONE", label: "เบอร์โทร", ph: "081-234-5678" },
    { key: "ADDRESS", label: "ที่อยู่", ph: "123 ถ.xxx แขวง/ตำบล..." },
    { key: "OPEN_HOURS", label: "เวลาทำการ", ph: "จ-ศ 9:00-18:00" },
    { key: "LINE_OA", label: "LINE OA", ph: "@shopname" },
    { key: "FACEBOOK_PAGE", label: "Facebook Page", ph: "https://fb.com/..." },
    { key: "WEBSITE", label: "Website", ph: "https://..." },
    { key: "WELCOME_MSG", label: "ข้อความต้อนรับ", ph: "สวัสดีครับ! ยินดีต้อนรับ..." },
    { key: "CLOSING_MSG", label: "ข้อความปิดการขาย", ph: "ขอบคุณที่ใช้บริการครับ..." },
    { key: "WARRANTY_POLICY", label: "นโยบายรับประกัน", ph: "รับประกัน 1 ปี..." },
    { key: "RETURN_POLICY", label: "นโยบายคืนสินค้า", ph: "คืนได้ภายใน 7 วัน..." },
  ];

  const inputCls = "w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 text-sm outline-none focus:border-blue-500 transition";

  return (
    <div>
      {/* Header & Tabs */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div className="flex flex-col">
          <h1 className="text-base md:text-xl font-black text-slate-900 leading-tight whitespace-nowrap">ข้อมูลร้าน</h1>
          <p className="text-[10px] text-gray-400 leading-none mt-0.5 hidden sm:block">ตั้งค่าข้อมูลทั่วไป วิธีรับชำระเงิน และลิงก์ร้านค้าของคุณ</p>
        </div>
        <div className="flex items-center gap-2 flex-shrink-0 w-full sm:w-auto">
          {[
            { id: "general", label: "ข้อมูลทั่วไป" },
            { id: "payment", label: "วิธีชำระเงิน" },
            { id: "slug", label: "URL ร้านค้า" },
          ].map(t => (
            <button key={t.id} onClick={() => setActiveTab(t.id)}
              className={"flex-1 sm:flex-none flex items-center justify-center py-2 px-3.5 text-[11px] sm:text-xs font-bold rounded-xl transition-all shadow-sm border " + (activeTab === t.id ? "bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/15" : "bg-white text-slate-600 border-gray-200 hover:bg-gray-50")}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {/* ── Tab: ข้อมูลทั่วไป ── */}
      {activeTab === "general" && (
        <div>
          <div className="grid md:grid-cols-2 gap-4">
            {fields.map(f => (
              <div key={f.key} className="bg-white border border-gray-200 rounded-xl p-4">
                <label className="block text-gray-500 text-xs mb-1">{f.label}</label>
                {f.key.includes("MSG") || f.key.includes("POLICY") ? (
                  <textarea value={info[f.key] || ""} onChange={e => setInfo({ ...info, [f.key]: e.target.value })}
                    placeholder={f.ph} rows={3} className={inputCls + " resize-none"} />
                ) : (
                  <input value={info[f.key] || ""} onChange={e => setInfo({ ...info, [f.key]: e.target.value })}
                    placeholder={f.ph} className={inputCls} />
                )}
              </div>
            ))}
          </div>
          <div className="mt-4 flex justify-end">
            <button onClick={save} disabled={saving}
              className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition">
              <Icon d={Icons.save} size={16} /> {saving ? "กำลังบันทึก..." : "บันทึกข้อมูลร้าน"}
            </button>
          </div>
        </div>
      )}

      {/* ── Tab: วิธีชำระเงิน ── */}
      {activeTab === "payment" && pay && (
        <div className="space-y-4 max-w-2xl">
          {/* Transfer / PromptPay */}
          <div className="bg-white border border-gray-200 rounded-xl p-4">
            <label className="flex items-center gap-2 text-gray-900 text-sm font-medium mb-3 cursor-pointer">
              <input type="checkbox" checked={pay.payment_transfer}
                onChange={e => setPay(p => ({ ...p, payment_transfer: e.target.checked }))}
                className="rounded border-gray-300 bg-white text-blue-500" />
              โอนเงิน / PromptPay
            </label>
            {pay.payment_transfer && (
              <div className="space-y-3 ml-6">
                <div>
                  <label className="block text-gray-500 text-xs mb-1">เลข PromptPay</label>
                  <input value={pay.payment_promptpay} onChange={e => setPay(p => ({ ...p, payment_promptpay: e.target.value }))}
                    placeholder="095-585-1136 หรือ เลขบัตรประชาชน" className={inputCls} />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-gray-500 text-xs mb-1">ธนาคาร</label>
                    <input value={pay.payment_bank_name} onChange={e => setPay(p => ({ ...p, payment_bank_name: e.target.value }))}
                      placeholder="กสิกรไทย" className={inputCls} />
                  </div>
                  <div>
                    <label className="block text-gray-500 text-xs mb-1">เลขบัญชี</label>
                    <input value={pay.payment_bank_account} onChange={e => setPay(p => ({ ...p, payment_bank_account: e.target.value }))}
                      placeholder="xxx-x-xxxxx-x" className={inputCls} />
                  </div>
                  <div>
                    <label className="block text-gray-500 text-xs mb-1">ชื่อบัญชี</label>
                    <input value={pay.payment_bank_acc_name} onChange={e => setPay(p => ({ ...p, payment_bank_acc_name: e.target.value }))}
                      placeholder="นาย/นาง..." className={inputCls} />
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* COD */}
          <div className="bg-white border border-gray-200 rounded-xl p-4">
            <label className="flex items-center gap-2 text-gray-900 text-sm font-medium mb-3 cursor-pointer">
              <input type="checkbox" checked={pay.payment_cod}
                onChange={e => setPay(p => ({ ...p, payment_cod: e.target.checked }))}
                className="rounded border-gray-300 bg-white text-blue-500" />
              เก็บเงินปลายทาง (COD)
            </label>
            {pay.payment_cod && (
              <div className="ml-6">
                <label className="block text-gray-500 text-xs mb-1">ค่าธรรมเนียม COD</label>
                <input value={pay.payment_cod_fee} onChange={e => setPay(p => ({ ...p, payment_cod_fee: e.target.value }))}
                  placeholder="ฟรี หรือ 20 บาท" className={inputCls} />
              </div>
            )}
          </div>

          {/* Pickup */}
          <div className="bg-white border border-gray-200 rounded-xl p-4">
            <label className="flex items-center gap-2 text-gray-900 text-sm font-medium cursor-pointer">
              <input type="checkbox" checked={pay.payment_pickup}
                onChange={e => setPay(p => ({ ...p, payment_pickup: e.target.checked }))}
                className="rounded border-gray-300 bg-white text-blue-500" />
              รับหน้าร้าน (จ่ายเงินสดที่ร้าน)
            </label>
          </div>

          <div className="bg-blue-500/10 border border-blue-500/30 rounded-xl p-3 text-blue-300 text-xs">
            Bot จะแจ้งวิธีชำระเงินให้ลูกค้าอัตโนมัติตามที่ตั้งค่าไว้
          </div>

          <div className="flex justify-end">
            <button onClick={savePayment} disabled={savingPay}
              className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition">
              <Icon d={Icons.save} size={16} /> {savingPay ? "กำลังบันทึก..." : "บันทึกวิธีชำระเงิน"}
            </button>
          </div>
        </div>
      )}

      {activeTab === "payment" && !pay && (
        <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 text-amber-300 text-sm">
          ไม่สามารถโหลดข้อมูลวิธีชำระเงินได้ กรุณาลองใหม่อีกครั้ง
        </div>
      )}

      {/* ── Tab: URL ร้านค้า (Slug) ── */}
      {activeTab === "slug" && (
        <div className="space-y-5 max-w-2xl">
          {/* Current URL */}
          <div className="bg-white border border-gray-200 rounded-xl p-5">
            <h3 className="text-gray-900 font-semibold text-sm mb-3">🔗 URL หน้าร้านค้าสาธารณะ</h3>
            <p className="text-gray-500 text-xs mb-4">ลูกค้าสามารถเปิดดูสินค้าของร้านได้ผ่าน URL นี้ แชร์ลงโซเชียลได้เลย</p>

            {slugData.url ? (
              <div className="flex items-center gap-2 bg-gray-50 border border-gray-300 rounded-lg p-3">
                <span className="text-blue-400 text-sm flex-1 truncate">{slugData.url}</span>
                <button onClick={() => { navigator.clipboard.writeText(slugData.url); setSlugCopied(true); setTimeout(() => setSlugCopied(false), 2000); }}
                  className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition whitespace-nowrap">
                  {slugCopied ? "Copied!" : "Copy"}
                </button>
                <a href={slugData.url} target="_blank" rel="noopener"
                  className="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-900 text-xs font-medium rounded-lg transition whitespace-nowrap">
                  Open
                </a>
              </div>
            ) : (
              <div className="text-amber-400 text-sm">ยังไม่มี slug — กรุณาตั้งค่าด้านล่าง</div>
            )}
          </div>

          {/* Edit Slug */}
          <div className="bg-white border border-gray-200 rounded-xl p-5">
            <h3 className="text-gray-900 font-semibold text-sm mb-3">แก้ไข Slug</h3>
            <p className="text-gray-500 text-xs mb-4">Slug คือส่วนท้ายของ URL เช่น /shop/<b className="text-gray-900">my-store</b> — ใช้ตัวอักษรภาษาอังกฤษ ตัวเลข และขีด (-) เท่านั้น ขั้นต่ำ 3 ตัวอักษร</p>

            <div className="flex items-center gap-2 mb-3">
              <span className="text-gray-400 text-sm whitespace-nowrap">/shop/</span>
              <input value={slugInput} onChange={e => setSlugInput(e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, "").replace(/-+/g, "-").slice(0, 60))}
                placeholder="my-store" className="flex-1 bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 text-sm outline-none focus:border-blue-500 transition" />
            </div>

            {/* Status indicator */}
            {slugInput && slugInput.length >= 3 && slugInput !== slugData.slug && (
              <div className={"text-xs mb-3 " + (slugChecking ? "text-gray-500" : slugAvailable ? "text-green-400" : slugAvailable === false ? "text-red-400" : "text-gray-500")}>
                {slugChecking ? "Checking..." : slugAvailable ? "✅ ใช้ได้!" : slugAvailable === false ? "❌ ถูกใช้แล้ว กรุณาเลือกชื่ออื่น" : ""}
              </div>
            )}
            {slugInput && slugInput.length < 3 && (
              <div className="text-xs mb-3 text-amber-400">ต้องมีอย่างน้อย 3 ตัวอักษร</div>
            )}

            <button onClick={async () => {
              if (!slugInput || slugInput.length < 3) { toast("Slug ต้องมีอย่างน้อย 3 ตัวอักษร", "err"); return; }
              if (slugInput === slugData.slug) { toast("Slug ไม่มีการเปลี่ยนแปลง", "err"); return; }
              setSavingSlug(true);
              const res = await api("/api/slug", { method: "PUT", body: { slug: slugInput } });
              if (res.success) {
                setSlugData({ slug: res.slug, url: res.url });
                toast("บันทึก URL สำเร็จ!", "ok");
                setSlugAvailable(null);
              } else {
                toast(res.error || "บันทึกไม่สำเร็จ", "err");
              }
              setSavingSlug(false);
            }} disabled={savingSlug || !slugInput || slugInput.length < 3 || slugInput === slugData.slug || slugAvailable === false}
              className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition">
              <Icon d={Icons.save} size={16} /> {savingSlug ? "กำลังบันทึก..." : "บันทึก URL"}
            </button>
          </div>

          {/* Info Box */}
          <div className="bg-blue-500/10 border border-blue-500/30 rounded-xl p-4 text-blue-300 text-xs space-y-1">
            <p>💡 <b>ประโยชน์ของ URL ร้านค้า:</b></p>
            <p>• แชร์ลิงก์ร้านให้ลูกค้าดูแค็ตตาล็อกสินค้าได้ทันที</p>
            <p>• ลูกค้ากดปุ่ม "แชทใน LINE" เพื่อสั่งซื้อผ่าน Bot ได้เลย</p>
            <p>• ใช้โปรโมทบน Social Media หรือนามบัตรได้</p>
          </div>
        </div>
      )}
    </div>
  );
}

function ProductsPage({ toast }) {
  const [products, setProducts] = useState([]);
  const [search, setSearch] = useState("");
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({});

  const load = useCallback(() => { api("/api/products").then(d => setProducts(d.products || [])).catch(() => {}); }, []);
  useEffect(load, [load]);

  const filtered = products.filter(p =>
    !search || (p.name || "").toLowerCase().includes(search.toLowerCase()) ||
    (p.category || "").toLowerCase().includes(search.toLowerCase())
  );

  const categories = React.useMemo(() => [...new Set(products.map(p => p.category).filter(Boolean))], [products]);

  const openEdit = (p) => { setEditing(p ? p.rowIndex : "new"); setForm(p || {}); };
  const saveProduct = async () => {
    const method = editing === "new" ? "POST" : "PUT";
    const url = editing === "new" ? "/api/products" : "/api/products/" + editing;
    const res = await api(url, { method, body: form });
    toast(res.success ? "บันทึกสินค้าแล้ว ✅" : res.error || "Error", res.success ? "ok" : "err");
    if (res.success) { setEditing(null); load(); }
  };
  const delProduct = async (ri) => {
    if (!confirm("ลบสินค้านี้?")) return;
    const res = await api("/api/products/" + ri, { method: "DELETE" });
    toast(res.success ? "ลบแล้ว" : "Error", res.success ? "ok" : "err");
    load();
  };

  const [syncing, setSyncing] = useState(false);

  const syncSheet = async () => {
    setSyncing(true);
    const res = await api("/api/sync", { method: "POST", body: { type: "products" } });
    toast(res.success ? "Sync สินค้าจาก Google Sheet สำเร็จ ✅" : (res.error || "Sync ไม่สำเร็จ — ตรวจสอบ Sheet ID"), res.success ? "ok" : "err");
    if (res.success) load();
    setSyncing(false);
  };

  const downloadTemplate = () => {
    const header = "รหัสสินค้า,ชื่อสินค้า,รายละเอียด,ราคา,ราคาโปร,จำนวนสต็อก,หมวดหมู่,ตัวเลือก,URL รูปภาพ,เปิดขาย";
    const example = "P001,เสื้อยืด Oversize,เสื้อยืดผ้าคอตตอน 100%,350,290,50,เสื้อผ้า,\"S,M,L,XL\",https://example.com/img.jpg,TRUE";
    const csv = header + "\n" + example;
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "botify_products_template.csv";
    link.click();
  };

  return (
    <div>
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <div className="flex items-center gap-2 mb-2">
          <h1 className="text-base md:text-xl font-black text-slate-900 leading-tight whitespace-nowrap">สินค้า ({products.length})</h1>
        </div>
        <div className="flex w-full sm:w-auto gap-1.5 sm:gap-2">
          <button onClick={downloadTemplate}
            className="flex-1 sm:flex-none flex items-center justify-center gap-1 bg-white border border-blue-400 hover:bg-blue-50 text-blue-600 text-[11px] sm:text-xs font-semibold px-1 sm:px-3 py-2 rounded-lg transition whitespace-nowrap" title="ดาวน์โหลด Template CSV">
            📥 Template
          </button>
          <button onClick={syncSheet} disabled={syncing}
            className="flex-1 sm:flex-none flex items-center justify-center gap-1 bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white text-[11px] sm:text-xs font-semibold px-1 sm:px-3 py-2 rounded-lg transition whitespace-nowrap" title="Sync สินค้าจาก Google Sheet">
            <Icon d={Icons.refresh} size={14} /> {syncing ? "Sync..." : "Sync Sheet"}
          </button>
          <button onClick={() => openEdit(null)} className="flex-1 sm:flex-none flex items-center justify-center gap-1 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] sm:text-sm font-semibold px-1 sm:px-3 py-2 rounded-lg transition whitespace-nowrap">
            <Icon d={Icons.plus} size={14} /> เพิ่มสินค้า
          </button>
        </div>
      </div>

      <div className="space-y-2">
        {filtered.map(p => (
          <div key={p.rowIndex} className="bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between gap-3">
            <div className="flex-1 min-w-0">
              <div className="text-gray-900 text-sm font-medium truncate">{p.name}</div>
              <div className="text-gray-400 text-xs">{p.category} | ราคา: {p.priceUsed || p.priceNew || "-"} | สต็อก: {p.stock}</div>
            </div>
            <div className="flex gap-1">
              <button onClick={() => openEdit(p)} className="text-blue-400 hover:bg-blue-500/20 p-1.5 rounded-lg transition"><Icon d={Icons.edit} size={16} /></button>
              <button onClick={() => delProduct(p.rowIndex)} className="text-red-400 hover:bg-red-500/20 p-1.5 rounded-lg transition"><Icon d={Icons.trash} size={16} /></button>
            </div>
          </div>
        ))}
        {filtered.length === 0 && <div className="text-gray-400 text-center py-10 text-sm">ไม่พบสินค้า</div>}
      </div>

      {editing !== null && (
        <Modal title={editing === "new" ? "เพิ่มสินค้า" : "แก้ไขสินค้า"} onClose={() => setEditing(null)} onSave={saveProduct}>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="ชื่อสินค้า *" val={form.name} set={v => setForm({ ...form, name: v })} />
            <div className="relative">
              <Field label="หมวดหมู่" val={form.category} set={v => setForm({ ...form, category: v })} datalist={categories} />
              <button onClick={() => { const nc = prompt("ชื่อหมวดหมู่ใหม่:"); if(nc) setForm({...form, category: nc.trim()}); }} className="absolute right-0 top-0 text-[10px] text-blue-500 font-bold hover:underline" type="button">
                + เพิ่มหมวดหมู่
              </button>
            </div>
            <Field label="ราคา (มือสอง)" val={form.priceUsed} set={v => setForm({ ...form, priceUsed: v })} />
            <Field label="ราคา (ใหม่)" val={form.priceNew} set={v => setForm({ ...form, priceNew: v })} />
            <Field label="สต็อก" val={form.stock} set={v => setForm({ ...form, stock: v })} />
            <Field label="ลิงก์ซื้อ" val={form.linkBuy} set={v => setForm({ ...form, linkBuy: v })} />
            <Field label="URL รูปภาพ" val={form.imageUrl} set={v => setForm({ ...form, imageUrl: v })} ph="https://..." />
            <Field label="หมายเหตุ" val={form.note} set={v => setForm({ ...form, note: v })} />
          </div>
          <div className="mt-3">
            <Field label="จุดเด่น / Features" val={form.feature} set={v => setForm({ ...form, feature: v })} area />
          </div>
        </Modal>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  ORDERS PAGE
// ═══════════════════════════════════════════════════════════
function OrdersPage({ toast }) {
  const [orders, setOrders] = useState([]);
  const [filter, setFilter] = useState("");

  const load = useCallback(() => { api("/api/orders?limit=100").then(d => setOrders(d.orders || [])).catch(() => {}); }, []);
  useEffect(() => { load(); }, [load]);

  // Supabase Realtime Subscription
  useEffect(() => {
    let channel = null;
    const shopId = sessionStorage.getItem("botify_shop_id");
    
    RealtimeManager.init().then(client => {
      if (!client) return;
      channel = client.channel('dashboard-orders')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
          if (shopId && payload.new && payload.new.workspace_id && payload.new.workspace_id !== shopId) return;
          load();
        })
        .subscribe();
    });

    return () => {
      if (channel) {
        RealtimeManager.init().then(client => client && client.removeChannel(channel));
      }
    };
  }, [load]);

  const updateStatus = async (ri, status) => {
    const res = await api("/api/orders/" + ri + "/status", { method: "PUT", body: { status } });
    toast(res.success ? 'อัพเดทเป็น "' + status + '" แล้ว' : "Error", res.success ? "ok" : "err");
    load();
  };

  const statuses = ["ทั้งหมด", "รอยืนยัน", "กำลังจัดเตรียม", "จัดส่งแล้ว", "ยกเลิก"];
  const filtered = orders.filter(o => !filter || o.status === filter);

  const statusColors = {
    "รอยืนยัน": "bg-amber-50 text-amber-700 border border-amber-200",
    "กำลังจัดเตรียม": "bg-blue-50 text-blue-700 border border-blue-200",
    "จัดส่งแล้ว": "bg-emerald-50 text-emerald-700 border border-emerald-200",
    "ยกเลิก": "bg-red-50 text-red-700 border border-red-200",
  };

  return (
    <div className="w-full flex flex-col font-sans">
      {/* Header */}
      <div className="flex items-center justify-between gap-3 mb-6">
        <div className="flex flex-col">
          <h1 className="text-base md:text-xl font-black text-slate-900 leading-tight whitespace-nowrap">ออเดอร์ ({orders.length})</h1>
          <p className="text-[10px] text-gray-400 leading-none mt-0.5 hidden sm:block">ตรวจสอบสถานะรายการสั่งซื้อและการจัดส่งทั้งหมด</p>
        </div>
        <button onClick={load} 
          className="flex items-center justify-center gap-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 text-xs font-bold px-3 py-2 rounded-xl transition shadow-sm">
          <Icon d={Icons.refresh} size={13} /> <span className="hidden sm:inline">รีเฟรชข้อมูล</span><span className="sm:hidden">รีเฟรช</span>
        </button>
      </div>

      {/* Filter Tabs */}
      <div className="flex gap-2 mb-5 overflow-x-auto pb-1 scrollbar-none">
        {statuses.map(s => (
          <button key={s} onClick={() => setFilter(s === "ทั้งหมด" ? "" : s)}
            className={"whitespace-nowrap px-3.5 py-2 rounded-xl text-xs font-bold transition border " + ((!filter && s === "ทั้งหมด") || filter === s ? "bg-blue-600 border-blue-600 text-white shadow-md shadow-blue-500/15" : "bg-white border-gray-200 text-slate-600 hover:bg-gray-50 hover:border-gray-300")}>
            {s}
          </button>
        ))}
      </div>

      {/* Grid List */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {filtered.map(o => (
          <div key={o.rowIndex} className="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow duration-200 flex flex-col justify-between">
            <div>
              <div className="flex items-center justify-between mb-3.5">
                <div className="text-slate-900 text-sm font-black tracking-wide">{o.orderId}</div>
                <span className={"text-[10px] font-black px-2.5 py-1 rounded-full uppercase tracking-wider " + (statusColors[o.status] || "bg-gray-50 border border-gray-200 text-gray-500")}>{o.status}</span>
              </div>
              <div className="space-y-2 mb-4">
                <div className="flex items-center gap-2 text-slate-700 text-xs">
                  <span className="text-gray-400 w-4 text-center">👤</span>
                  <span className="font-semibold text-slate-800">{o.name}</span>
                </div>
                <div className="flex items-center gap-2 text-slate-700 text-xs">
                  <span className="text-gray-400 w-4 text-center">🛍️</span>
                  <span className="font-semibold text-slate-800">{o.product} <span className="text-gray-400 font-normal">x{o.qty}</span></span>
                </div>
                <div className="flex items-center gap-2 text-slate-700 text-xs">
                  <span className="text-gray-400 w-4 text-center">📱</span>
                  <span>แพลตฟอร์ม: <span className="font-bold text-slate-800">{o.platform}</span></span>
                </div>
                {o.trackingNo && (
                  <div className="flex items-center gap-2 text-xs bg-emerald-50 text-emerald-800 p-2.5 rounded-xl border border-emerald-100/50 mt-1">
                    <span className="text-emerald-500 font-bold">🚚</span>
                    <span>จัดส่งโดย: <span className="font-bold">{o.carrier}</span> | เลขติดตาม: <span className="font-mono font-bold tracking-wider">{o.trackingNo}</span></span>
                  </div>
                )}
              </div>
            </div>
            {o.status === "รอยืนยัน" && (
              <div className="flex gap-2 pt-3 border-t border-gray-100 mt-2">
                <button onClick={() => updateStatus(o.rowIndex, "กำลังจัดเตรียม")}
                  className="flex-1 text-center py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition shadow-sm shadow-emerald-500/10">
                  ยืนยันออเดอร์
                </button>
                <button onClick={() => updateStatus(o.rowIndex, "ยกเลิก")}
                  className="py-2 px-4 bg-gray-50 hover:bg-red-50 text-slate-600 hover:text-red-600 border border-gray-200 hover:border-red-200 text-xs font-bold rounded-xl transition">
                  ยกเลิก
                </button>
              </div>
            )}
          </div>
        ))}
        {filtered.length === 0 && (
          <div className="col-span-full bg-white border border-gray-100 rounded-2xl py-12 text-center text-gray-400 font-bold shadow-sm">
            ไม่มีออเดอร์
          </div>
        )}
      </div>
    </div>
  );
}

//  PROMOTIONS PAGE
// ═══════════════════════════════════════════════════════════
function PromotionsPage({ toast }) {
  const [promos, setPromos] = useState([]);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({});

  const load = useCallback(() => { api("/api/promotions").then(d => setPromos(d.promotions || [])).catch(() => {}); }, []);
  useEffect(load, [load]);

  const openEdit = (p) => { setEditing(p ? p.rowIndex : "new"); setForm(p || {}); };
  const savePromo = async () => {
    const method = editing === "new" ? "POST" : "PUT";
    const url = editing === "new" ? "/api/promotions" : "/api/promotions/" + editing;
    const res = await api(url, { method, body: form });
    toast(res.success ? "บันทึกโปรโมชั่นแล้ว ✅" : res.error || "Error", res.success ? "ok" : "err");

  return (
    <div className="w-full flex flex-col font-sans">
      {/* Header */}
      <div className="flex items-center justify-between gap-3 mb-6">
        <div className="flex flex-col">
          <h1 className="text-base md:text-xl font-black text-slate-900 leading-tight whitespace-nowrap">โปรโมชั่น ({promos.length})</h1>
          <p className="text-[10px] text-gray-400 leading-none mt-0.5 hidden sm:block">จัดการคูปอง ส่วนลด และแคมเปญส่งเสริมการขายประจำร้าน</p>

        <button onClick={() => openEdit(null)} 
          className="flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl transition shadow-md shadow-emerald-500/10">
          <Icon d={Icons.plus} size={14} /> <span className="hidden sm:inline">เพิ่มโปรโมชั่น</span><span className="sm:hidden">เพิ่มโปรฯ</span>
        </button>
      </div>

      {/* Grid List */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {promos.map(p => (
          <div key={p.rowIndex} className="bg-white border border-gray-100 rounded-2xl p-5 flex items-center justify-between shadow-sm hover:shadow-md transition-all duration-200">
            <div className="flex-1 min-w-0 pr-4">
              <div className="text-slate-900 text-sm font-black truncate">{p.promoName}</div>
              <div className="text-slate-500 text-xs mt-1.5 line-clamp-2 leading-relaxed">{p.promoText}</div>
              <div className="flex items-center gap-2 text-[10px] text-gray-400 mt-3 font-semibold">
                <span>📅 {p.startDate || "-"} ถึง {p.endDate || "-"}</span>
                {p.target && (
                  <>
                    <span>•</span>
                    <span className="bg-gray-100 text-slate-600 px-1.5 py-0.5 rounded-md">🎯 {p.target}</span>
                  </>

            </div>
            <button onClick={() => openEdit(p)} 
              className="p-2 bg-gray-50 hover:bg-blue-50 text-slate-700 hover:text-blue-600 border border-gray-100 hover:border-blue-200 rounded-xl transition shadow-sm">
              <Icon d={Icons.edit} size={16} />

        {promos.length === 0 && (
          <div className="col-span-full bg-white border border-gray-100 rounded-2xl py-12 text-center text-gray-400 font-bold shadow-sm">
            ยังไม่มีโปรโมชั่น
          </div>

      {editing !== null && (
        <Modal title={editing === "new" ? "เพิ่มโปรโมชั่น" : "แก้ไขโปรโมชั่น"} onClose={() => setEditing(null)} onSave={savePromo}>
          <div className="space-y-3.5">
            <Field label="ชื่อโปรโมชั่น *" val={form.promoName} set={v => setForm({ ...form, promoName: v })} />
            <Field label="ข้อความโปรโมชั่น *" val={form.promoText} set={v => setForm({ ...form, promoText: v })} area />

              <Field type="date" label="วันเริ่ม" val={form.startDate} set={v => setForm({ ...form, startDate: v })} ph="วว/ดด/ปปปป" />
              <Field type="date" label="วันสิ้นสุด" val={form.endDate} set={v => setForm({ ...form, endDate: v })} ph="วว/ดด/ปปปป" />
            </div>
            <Field label="กลุ่มเป้าหมาย" val={form.target} set={v => setForm({ ...form, target: v })} ph="เช่น all, member" />
          </div>
        </Modal>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  BOOKINGS / SLOTS PAGE
// ═══════════════════════════════════════════════════════════
function BookingsPage({ toast }) {
  const [bookings, setBookings] = useState([]);
  const [slots, setSlots] = useState([]);
  const [tab, setTab] = useState("bookings");
  const [showAddBooking, setShowAddBooking] = useState(false);
  const [showAddSlot, setShowAddSlot] = useState(false);
  const [bkForm, setBkForm] = useState({ name: "", phone: "", service: "", date: "", time: "" });
  const [slForm, setSlForm] = useState({ day: "", time_slot: "", service: "ทุกบริการ", max_slots: "1" });

  const loadData = useCallback(() => {
    api("/api/bookings").then(d => setBookings(d.bookings || [])).catch(() => {});
    api("/api/slots").then(d => setSlots(d.slots || [])).catch(() => {});
  }, []);
  useEffect(loadData, [loadData]);

  const updateBooking = async (ri, status) => {
    const res = await api("/api/bookings/" + ri + "/status", { method: "PUT", body: { status } });
    toast(res.success ? "อัพเดทแล้ว" : "Error", res.success ? "ok" : "err");
    loadData();
  };

  const saveBooking = async () => {
    if (!bkForm.name || !bkForm.service || !bkForm.date) { toast("กรุณากรอกข้อมูลให้ครบ", "err"); return; }
    const res = await api("/api/bookings", { method: "POST", body: bkForm });
    toast(res.success ? "สร้างนัดหมายแล้ว ✅" : (res.error || "Error"), res.success ? "ok" : "err");
    if (res.success) { setShowAddBooking(false); setBkForm({ name: "", phone: "", service: "", date: "", time: "" }); loadData(); }
  };

  const saveSlot = async () => {
    if (!slForm.day || !slForm.time_slot) { toast("กรุณากรอกวันและเวลา", "err"); return; }
    const res = await api("/api/slots", { method: "POST", body: slForm });
    toast(res.success ? "สร้าง Slot แล้ว ✅" : (res.error || "Error"), res.success ? "ok" : "err");
    if (res.success) { setShowAddSlot(false); setSlForm({ day: "", time_slot: "", service: "ทุกบริการ", max_slots: "1" }); loadData(); }
  };

  return (
    <div>
      <div className="flex items-center justify-between gap-3 mb-6">
        <div className="flex flex-col">
          <h1 className="text-base md:text-xl font-black text-slate-900 leading-tight whitespace-nowrap">นัดหมาย / จอง</h1>
          <p className="text-[10px] text-gray-400 leading-none mt-0.5 hidden sm:block">จัดการตารางนัดหมายและการจองคิวบริการของลูกค้า</p>
        </div>
        {tab === "bookings" ? (
          <button onClick={() => setShowAddBooking(true)} 
            className="flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl transition shadow-md shadow-emerald-500/10">
            <Icon d={Icons.plus} size={14} /> <span className="hidden sm:inline">เพิ่มนัดหมาย</span><span className="sm:hidden">เพิ่มนัด</span>
          </button>
        ) : (
          <button onClick={() => setShowAddSlot(true)} 
            className="flex items-center justify-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl transition shadow-md shadow-blue-500/10">
            <Icon d={Icons.plus} size={14} /> <span className="hidden sm:inline">เพิ่ม Slot</span><span className="sm:hidden">เพิ่ม Slot</span>
          </button>
        )}
      </div>

      <div className="flex gap-2 mb-5 overflow-x-auto pb-1 scrollbar-none">
        {["bookings", "slots"].map(t => (
          <button key={t} onClick={() => setTab(t)}
            className={"whitespace-nowrap px-3.5 py-2 rounded-xl text-xs font-bold transition border " + (tab === t ? "bg-blue-600 border-blue-600 text-white shadow-md shadow-blue-500/15" : "bg-white border-gray-200 text-slate-600 hover:bg-gray-50 hover:border-gray-300")}>
            {t === "bookings" ? "📅 รายการจอง" : "⏰ เวลาทำการ / Slots"}
          </button>
        ))}
      </div>

      <div className="bg-blue-500/10 border border-blue-500/30 rounded-xl p-3 mb-4 text-blue-300 text-xs leading-relaxed">
        💡 <strong>Sync บริการ:</strong> สำหรับร้านที่ให้บริการ (สปา, คลินิก, ร้านตัดผม ฯลฯ) ให้สร้าง Slot ตาม "วัน + เวลา + บริการ" ที่เปิดให้จอง
        แล้วลูกค้าจองผ่าน LINE Bot ได้อัตโนมัติ หรือ Sync จาก Google Sheet ชีต "Slots" ที่มีคอลัมน์: วัน, เวลา, บริการ, จำนวน, สถานะ
      </div>

      {tab === "bookings" ? (
        <div className="space-y-2">
          {bookings.map(b => (
            <div key={b.rowIndex || b.id} className="bg-white border border-gray-200 rounded-xl p-4">
              <div className="flex items-center justify-between mb-1">
                <span className="text-gray-900 text-sm font-semibold">{b.bookingId || b.booking_code || "N/A"}</span>
                <span className={"text-xs px-2 py-0.5 rounded-full " + (b.status?.includes("ยืนยัน") || b.status === "confirmed" ? "bg-emerald-500/20 text-emerald-400" : "bg-amber-500/20 text-amber-400")}>{b.status}</span>
              </div>
              <div className="text-gray-500 text-xs">👤 {b.name || b.customer_name} | 🎯 {b.service} | 📆 {b.date || b.appt_date} {b.time || b.appt_time}</div>
              {(b.status === "รอยืนยัน" || b.status === "confirmed") && (
                <div className="flex gap-2 mt-2">
                  <button onClick={() => updateBooking(b.rowIndex || b.id, "ยืนยัน")} className="text-xs bg-emerald-600/30 text-emerald-300 border border-emerald-500/50 px-3 py-1 rounded-lg">ยืนยัน</button>
                  <button onClick={() => updateBooking(b.rowIndex || b.id, "ยกเลิก")} className="text-xs bg-red-500/20 text-red-400 border border-red-500/50 px-3 py-1 rounded-lg">ยกเลิก</button>
                </div>
              )}
            </div>
          ))}
          {bookings.length === 0 && <div className="text-gray-400 text-center py-10 text-sm">ไม่มีรายการจอง</div>}
        </div>
      ) : (
        <div className="space-y-2">
          {slots.map(s => (
            <div key={s.rowIndex || s.id} className="bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between">
              <div>
                <div className="text-gray-900 text-sm font-medium">{s.day} — {s.time_slot || s.time}</div>
                <div className="text-gray-400 text-xs">{s.service} | จำนวน: {s.max_slots || s.maxSlots || 1} | {s.status || "open"}</div>
              </div>
              <span className={"text-xs px-2 py-0.5 rounded-full " + (s.status === "open" || !s.status ? "bg-emerald-500/20 text-emerald-400" : "bg-red-500/20 text-red-400")}>
                {s.status === "open" || !s.status ? "เปิด" : "ปิด"}
              </span>
            </div>
          ))}
          {slots.length === 0 && <div className="text-gray-400 text-center py-10 text-sm">ยังไม่มี Slots — กดปุ่ม "เพิ่ม Slot" เพื่อสร้าง</div>}
        </div>
      )}

      {showAddBooking && (
        <Modal title="เพิ่มนัดหมาย" onClose={() => setShowAddBooking(false)} onSave={saveBooking}>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="ชื่อลูกค้า *" val={bkForm.name} set={v => setBkForm({ ...bkForm, name: v })} />
            <Field label="เบอร์โทร" val={bkForm.phone} set={v => setBkForm({ ...bkForm, phone: v })} />
            <Field label="บริการ *" val={bkForm.service} set={v => setBkForm({ ...bkForm, service: v })} ph="เช่น ตัดผม, สปา, นวด" />
            <Field type="date" label="วันที่ *" val={bkForm.date} set={v => setBkForm({ ...bkForm, date: v })} ph="วว/ดด/ปปปป" />
            <Field type="time" label="เวลา" val={bkForm.time} set={v => setBkForm({ ...bkForm, time: v })} ph="10:00" />
          </div>
        </Modal>
      )}

      {showAddSlot && (
        <Modal title="เพิ่ม Slot" onClose={() => setShowAddSlot(false)} onSave={saveSlot}>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field type="date" label="วัน *" val={slForm.day} set={v => setSlForm({ ...slForm, day: v })} ph="วว/ดด/ปปปป" />
            <Field label="เวลา *" val={slForm.time_slot} set={v => setSlForm({ ...slForm, time_slot: v })} ph="10:00-11:00" />
            <Field label="บริการ" val={slForm.service} set={v => setSlForm({ ...slForm, service: v })} ph="ทุกบริการ" />
            <Field label="จำนวนสูงสุด" val={slForm.max_slots} set={v => setSlForm({ ...slForm, max_slots: v })} ph="1" />
          </div>
        </Modal>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  🔌 CHANNEL SETTINGS — เชื่อมต่อ LINE / Facebook / Google Sheet
// ═══════════════════════════════════════════════════════════
function ChannelSettingsPage({ toast }) {
  const [channels, setChannels] = useState({
    line_token: "", line_bot_id: "", owner_line_id: "",
    fb_token: "", fb_page_id: "", sheet_id: "",
  });
  const [connected, setConnected] = useState({ line: false, facebook: false, sheet: false });
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [testing, setTesting] = useState(false);
  const [botInfo, setBotInfo] = useState(null);

  useEffect(() => {
    api("/api/channels").then(r => {
      if (r.success) {
        setChannels(r.channels);
        setConnected(r.connected);
      }
    }).catch(() => {}).finally(() => setLoading(false));
  }, []);

  const save = async () => {
    setSaving(true);
    try {
      const r = await api("/api/channels", "PUT", channels);
      if (r.success) { toast("บันทึกการเชื่อมต่อสำเร็จ — ระบบอัพเดทแล้ว", "success"); }
      else toast(r.error || "บันทึกไม่สำเร็จ", "error");
    } catch (e) { toast(e.message, "error"); }
    setSaving(false);
  };

  const testLine = async () => {
    const token = channels.line_token;
    if (!token || token.includes("•")) return toast("กรุณาใส่ LINE Token ใหม่ก่อนทดสอบ", "error");
    setTesting(true);
    setBotInfo(null);
    try {
      const r = await api("/api/channels/test-line", "POST", { token });
      if (r.success) {
        setBotInfo(r.bot);
        // Auto-fill Bot ID
        if (r.bot.userId) setChannels(c => ({ ...c, line_bot_id: r.bot.userId }));
        toast("เชื่อมต่อ LINE สำเร็จ — " + r.bot.displayName, "success");
      } else toast(r.error, "error");
    } catch (e) { toast(e.message, "error"); }
    setTesting(false);
  };

  const Field = ({ label, field, placeholder, type }) => (
    <div>
      <label className="text-gray-700 text-xs font-medium block mb-1">{label}</label>
      <input type={type || "text"} value={channels[field] || ""} placeholder={placeholder}

        className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-slate-500 focus:outline-none focus:border-blue-500 font-mono" />
    </div>
  );

  const StatusBadge = ({ ok, label }) => (
    <span className={"inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium " + (ok ? "bg-green-500/20 text-green-400" : "bg-slate-600/30 text-gray-500")}>
      <span className={"w-2 h-2 rounded-full " + (ok ? "bg-green-400" : "bg-slate-500")} />
      {ok ? "เชื่อมต่อแล้ว" : "ยังไม่เชื่อมต่อ"}
    </span>
  );

  if (loading) return <div className="flex justify-center py-20"><div className="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin" /></div>;

  return (
    <div>
      <div className="flex items-center justify-between gap-3 mb-6">
        <div className="flex flex-col">
          <h1 className="text-base md:text-xl font-black text-slate-900 leading-tight whitespace-nowrap">เชื่อมต่อช่องทาง</h1>
          <p className="text-[10px] text-gray-400 leading-none mt-0.5 hidden sm:block">เชื่อมโยงร้านค้าของคุณเข้ากับ LINE, Facebook และ Google Sheet</p>
        </div>
        <button onClick={save} disabled={saving}
          className="flex items-center justify-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl transition shadow-md shadow-blue-500/10 disabled:opacity-50">
          <Icon d={Icons.save} size={14} /> {saving ? "กำลังบันทึก..." : "บันทึกทั้งหมด"}
        </button>
      </div>

      <div className="space-y-4">
        {/* LINE */}
        <div className="bg-white rounded-xl border border-gray-200/50 p-5">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-green-600 flex items-center justify-center text-white font-bold text-lg">L</div>
              <div>
                <div className="text-gray-900 font-semibold">LINE Messaging API</div>
                <div className="text-gray-500 text-xs">เชื่อมต่อบอทกับ LINE OA ของร้าน</div>
              </div>
            </div>
            <StatusBadge ok={connected.line} />
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <Field label="Channel Access Token" field="line_token" placeholder="ใส่ token จาก LINE Developers Console" type="password" />
              <button onClick={testLine} disabled={testing}
                className="mt-2 px-3 py-1.5 bg-green-600/20 text-green-400 hover:bg-green-600/30 rounded text-xs font-medium disabled:opacity-50">
                {testing ? "กำลังทดสอบ..." : "🔍 ทดสอบ Token"}
              </button>
            </div>
            <Field label="Bot User ID" field="line_bot_id" placeholder="Uxxxxxxx (ได้จากการทดสอบ)" />
            <Field label="Owner LINE User ID" field="owner_line_id" placeholder="LINE User ID เจ้าของร้าน (รับแจ้งเตือน)" />
          </div>
          {botInfo && (
            <div className="mt-3 p-3 bg-green-500/10 rounded-lg border border-green-500/20 flex items-center gap-3">
              {botInfo.pictureUrl && <img src={botInfo.pictureUrl} className="w-10 h-10 rounded-full" />}

                <div className="text-gray-500 text-xs font-mono">{botInfo.userId}</div>
              </div>
            </div>
          )}
        </div>

        {/* Facebook */}
        <div className="bg-white rounded-xl border border-gray-200/50 p-5">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-lg">f</div>
              <div>
                <div className="text-gray-900 font-semibold">Facebook Messenger</div>

            </div>
            <StatusBadge ok={connected.facebook} />
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            <Field label="Page Access Token" field="fb_token" placeholder="ใส่ token จาก Meta Developer Console" type="password" />
            <Field label="Page ID" field="fb_page_id" placeholder="Facebook Page ID" />
          </div>
          <div className="flex flex-col sm:flex-row sm:items-center justify-between mt-2 gap-2">
            <p className="text-amber-500 text-xs">* ต้อง App Review จาก Meta ก่อนจึงจะใช้งานจริงได้</p>
            <a href="https://developers.facebook.com/docs/messenger-platform/getting-started/app-setup" target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:text-blue-800 text-xs underline flex items-center gap-1 w-fit">
              <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
              คู่มือการเชื่อมต่อ Facebook
            </a>
          </div>
        </div>

        {/* Google Sheet */}
        <div className="bg-white rounded-xl border border-gray-200/50 p-5">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-lg">G</div>
              <div>
                <div className="text-gray-900 font-semibold">Google Sheets</div>
                <div className="text-gray-500 text-xs">เชื่อมต่อ Google Sheet เก็บข้อมูลสินค้า / ออเดอร์</div>
              </div>
            </div>
            <StatusBadge ok={connected.sheet} />
          </div>
          <Field label="Google Sheet ID" field="sheet_id" placeholder="ใส่ ID จาก URL ของ Google Sheet" />
          <p className="text-gray-500 text-xs mt-2">Sheet ID อยู่ใน URL: docs.google.com/spreadsheets/d/<span className="text-amber-400">SHEET_ID_ตรงนี้</span>/edit</p>
        </div>
      </div>
    </div>
  );
}
