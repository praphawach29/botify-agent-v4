// ═══════════════════════════════════════════════════════════
//  USER MANAGEMENT (Super Admin only)
// ═══════════════════════════════════════════════════════════
function UserManagementPage({ toast }) {
  const [users, setUsers] = useState([]);
  const [shops, setShops] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showCreate, setShowCreate] = useState(false);
  const [editUser, setEditUser] = useState(null);
  const [form, setForm] = useState({ email: "", password: "", displayName: "", shopId: "", role: "shop_owner" });

  const loadUsers = useCallback(() => {
    setLoading(true);
    Promise.all([
      api("/api/auth/users").then(r => { if (r.users) setUsers(r.users); }),
      api("/api/shops").then(r => { if (r.shops) setShops(r.shops); }),
    ]).catch(() => {}).finally(() => setLoading(false));
  }, []);
  useEffect(() => { loadUsers(); }, [loadUsers]);

  const openCreate = () => {
    setEditUser(null);
    setForm({ email: "", password: "", displayName: "", shopId: "", role: "shop_owner" });
    setShowCreate(true);
  };

  const openEdit = (u) => {
    setShowCreate(false);
    setForm({ email: u.email || "", password: "", displayName: u.display_name || "", shopId: u.shop_id || "", role: u.role || "shop_owner" });
    setEditUser(u);
  };

  const createUser = async () => {
    if (!form.email.trim() || !form.password || form.password.length < 6) {
      toast("กรุณากรอก email และ password (อย่างน้อย 6 ตัว)", "err"); return;
    }
    const res = await api("/api/auth/create-user", {
      method: "POST",
      body: { email: form.email.trim(), password: form.password, displayName: form.displayName.trim() || form.email.trim(), shopId: form.shopId || null, role: form.role },
    });
    if (res.success) {
      toast("สร้างผู้ใช้สำเร็จ", "ok");
      setShowCreate(false);
      setForm({ email: "", password: "", displayName: "", shopId: "", role: "shop_owner" });
      loadUsers();
    } else { toast(res.error || "สร้างไม่สำเร็จ", "err"); }
  };

  const updateUser = async () => {
    if (!editUser) return;
    const body = { userId: editUser.id, displayName: form.displayName.trim(), shopId: form.shopId || null, role: form.role };
    if (form.password && form.password.length >= 6) body.password = form.password;
    else if (form.password && form.password.length > 0 && form.password.length < 6) {
      toast("password ต้องอย่างน้อย 6 ตัว", "err"); return;
    }
    const res = await api("/api/auth/update-user", { method: "PUT", body });
    if (res.success) {
      toast("อัพเดทผู้ใช้สำเร็จ", "ok");
      setEditUser(null);
      loadUsers();
    } else { toast(res.error || "อัพเดทไม่สำเร็จ", "err"); }
  };

  if (loading) return <Loader />;

  const userFormFields = (isEdit) => (
    <div className="space-y-3">
      <div>
        <label className="block text-gray-500 text-xs mb-1">Email</label>
        {isEdit ? (
          <input type="email" value={form.email || "- ไม่พบข้อมูลอีเมล -"} disabled
            className="w-full bg-gray-100 border border-gray-200 rounded-lg px-3 py-2 text-gray-500 text-sm cursor-not-allowed truncate" />
        ) : (
          <input type="email" value={form.email} onChange={e => setForm(f => ({ ...f, email: e.target.value }))}
            placeholder="user@example.com"
            autoComplete="email" autoCapitalize="none" autoCorrect="off"
            className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 text-sm outline-none focus:border-blue-500 truncate" />
        )}
      </div>
      <div>
        <label className="block text-gray-500 text-xs mb-1">{isEdit ? "Password ใหม่ (เว้นว่างถ้าไม่เปลี่ยน)" : "Password (อย่างน้อย 6 ตัว)"}</label>
        <input type="password" value={form.password} onChange={e => setForm(f => ({ ...f, password: e.target.value }))}
          placeholder={isEdit ? "เว้นว่างถ้าไม่ต้องการเปลี่ยน" : ""}
          className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 text-sm outline-none focus:border-blue-500" />
      </div>
      <div>
        <label className="block text-gray-500 text-xs mb-1">ชื่อที่แสดง</label>
        <input type="text" value={form.displayName} onChange={e => setForm(f => ({ ...f, displayName: e.target.value }))}
          className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 text-sm outline-none focus:border-blue-500" />
      </div>
      <div>
        <label className="block text-gray-500 text-xs mb-1">ร้านค้า</label>
        <DropdownSelect value={form.shopId} onChange={v => setForm(f => ({ ...f, shopId: v }))}
          placeholder="-- เลือกร้าน --"
          options={[{value:"",label:"-- เลือกร้าน --"}, ...shops.map(s => ({value:s.id,label:s.name}))]} />
      </div>
      <div>
        <label className="block text-gray-500 text-xs mb-1">Role</label>
        <DropdownSelect value={form.role} onChange={v => setForm(f => ({ ...f, role: v }))}
          options={[{value:"shop_owner",label:"Shop Owner"},{value:"staff",label:"Staff"}]} />
      </div>
    </div>
  );

  return (
    <div>
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-xl font-bold text-gray-900">จัดการผู้ใช้</h2>
        <button onClick={openCreate} className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
          <Icon d={Icons.plus} size={16} /> เพิ่มผู้ใช้
        </button>
      </div>

      {/* Mobile: cards / Desktop: table */}
      <div className="hidden sm:block bg-white border border-gray-200 rounded-xl overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="border-b border-gray-200 text-gray-500 text-xs">
              <th className="text-left px-4 py-3">Email</th>
              <th className="text-left px-4 py-3">ชื่อที่แสดง</th>
              <th className="text-left px-4 py-3">ร้าน</th>
              <th className="text-left px-4 py-3">Role</th>
              <th className="text-left px-4 py-3 w-16"></th>
            </tr>
          </thead>
          <tbody>
            {users.length === 0 ? (
              <tr><td colSpan={5} className="text-center text-gray-400 py-8">ยังไม่มีผู้ใช้</td></tr>
            ) : users.map((u, i) => (
              <tr key={i} className="border-b border-gray-200/50 hover:bg-gray-100/20">
                <td className="px-4 py-3 text-gray-900 text-xs">{u.email}</td>
                <td className="px-4 py-3 text-gray-700 text-sm">{u.display_name || "-"}</td>
                <td className="px-4 py-3 text-gray-700 text-sm">{u.shops?.name || u.shopName || "-"}</td>
                <td className="px-4 py-3"><span className="text-xs px-2 py-0.5 rounded-full font-medium bg-blue-100 text-blue-800">{u.role || "shop_owner"}</span></td>
                <td className="px-4 py-3">
                  <button onClick={() => openEdit(u)} className="text-blue-400 hover:text-blue-300 text-xs font-medium transition">แก้ไข</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Mobile cards */}
      <div className="sm:hidden space-y-3">
        {users.length === 0 ? (
          <div className="text-center text-gray-400 py-8">ยังไม่มีผู้ใช้</div>
        ) : users.map((u, i) => (
          <div key={i} className="bg-white border border-gray-200 rounded-xl p-4" onClick={() => openEdit(u)}>
            <div className="flex items-center justify-between mb-2">
              <span className="text-gray-900 text-sm font-medium">{u.display_name || u.email}</span>
              <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-blue-100 text-blue-800">{u.role || "shop_owner"}</span>
            </div>
            <div className="text-gray-500 text-xs mb-1">{u.email}</div>
            <div className="text-gray-400 text-xs">ร้าน: {u.shops?.name || u.shopName || "-"}</div>
          </div>
        ))}
      </div>

      {showCreate && (
        <Modal title="เพิ่มผู้ใช้ใหม่" onClose={() => setShowCreate(false)} onSave={createUser}>
          {userFormFields(false)}
        </Modal>
      )}

      {editUser && (
        <Modal title={"แก้ไขผู้ใช้: " + (editUser.display_name || editUser.email)} onClose={() => setEditUser(null)} onSave={updateUser}>
          {userFormFields(true)}
        </Modal>
      )}
    </div>
  );
}

function ShopPicker({ currentShop, onSelect }) {
  const [shopList, setShopList] = useState([]);
  useEffect(() => {
    api("/api/shops").then(r => { if (r.shops) setShopList(r.shops); }).catch(() => {});
  }, []);

  if (shopList.length === 0) return null;

  return (
    <div className="px-3 py-2 border-b border-gray-200/50">
      <label className="text-gray-400 text-xs block mb-1">เลือกร้าน</label>
      <DropdownSelect value={currentShop} onChange={v => onSelect(v)}
        options={[{value:"all",label:"ทุกร้าน"}, ...shopList.map(s => ({value:s.id,label:s.name}))]} />
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  PAYMENT PAGE (Shop Owner — เลือกแพ็กเกจ + ชำระเงิน)
// ═══════════════════════════════════════════════════════════
function PaymentPage({ toast }) {
  const [packages, setPackages] = useState([]);
  const [config, setConfig] = useState(null);
  const [subscription, setSubscription] = useState(null);
  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(true);
  const [paying, setPaying] = useState(false);
  const [tab, setTab] = useState("plans"); // plans | history
  const [selectedPkg, setSelectedPkg] = useState(null);
  const [showPayModal, setShowPayModal] = useState(false);

  useEffect(() => {
    Promise.all([
      api("/api/payment/packages"),
      api("/api/payment/config"),
      api("/api/payment/subscription"),
      api("/api/payment/history"),
    ]).then(([pkgR, cfgR, subR, hisR]) => {
      setPackages(pkgR.packages || []);
      setConfig(cfgR);
      setSubscription(subR.subscription);
      setHistory(hisR.payments || []);
    }).catch(() => {}).finally(() => setLoading(false));
  }, []);

  const payStripe = async (pkgId) => {
    setPaying(true);
    try {
      const r = await api("/api/payment/stripe/checkout", { method: "POST", body: JSON.stringify({ package_id: pkgId }) });
      if (r.checkout_url) window.location.href = r.checkout_url;
      else toast(r.error || "ไม่สามารถสร้าง checkout ได้", "error");
    } catch (e) { toast(e.message, "error"); }
    setPaying(false);
  };

  const payOmise = async (pkgId, sourceType) => {
    setPaying(true);
    try {
      const r = await api("/api/payment/omise/charge", { method: "POST", body: JSON.stringify({ package_id: pkgId, source_type: sourceType }) });
      if (r.authorize_uri) window.location.href = r.authorize_uri;
      else if (r.qr_code_url) {
        toast("สแกน QR Code เพื่อชำระเงิน", "success");
        // Show QR in modal (basic approach)
        setShowPayModal(false);
        window.open(r.qr_code_url, "_blank", "width=400,height=400");
      } else if (r.success && r.status === "successful") {
        toast("ชำระเงินสำเร็จ!", "success");
        setShowPayModal(false);
        // Reload
        const subR = await api("/api/payment/subscription");
        setSubscription(subR.subscription);
      } else toast(r.error || "เกิดข้อผิดพลาด", "error");
    } catch (e) { toast(e.message, "error"); }
    setPaying(false);
  };

  const payManual = async (pkgId, method) => {
    setPaying(true);
    try {
      const r = await api("/api/payment/manual", { method: "POST", body: JSON.stringify({ package_id: pkgId, payment_method: method }) });
      if (r.success) {
        toast(`แจ้งชำระเงินสำเร็จ! เลขที่ ${r.invoice_number} — รอ Admin ยืนยัน`, "success");
        setShowPayModal(false);
        const hisR = await api("/api/payment/history");
        setHistory(hisR.payments || []);
      } else toast(r.error || "เกิดข้อผิดพลาด", "error");
    } catch (e) { toast(e.message, "error"); }
    setPaying(false);
  };

  if (loading) return <Loader />;

  const statusColors = { paid: "#10b981", pending: "#f59e0b", pending_review: "#3b82f6", failed: "#ef4444", overdue: "#ef4444" };
  const statusLabels = { paid: "ชำระแล้ว", pending: "รอชำระ", pending_review: "รอตรวจสอบ", failed: "ไม่สำเร็จ", overdue: "เกินกำหนด" };
  const gwLabels = { stripe: "Stripe", omise: "Omise", omise_promptpay: "PromptPay (Omise)", promptpay: "พร้อมเพย์", bank_transfer: "โอนธนาคาร", manual: "แจ้งชำระ" };

  return (
    <div>
      <div className="flex items-center justify-between gap-3 mb-6">
        <div className="flex flex-col">
          <h1 className="text-base md:text-xl font-black text-slate-900 leading-tight whitespace-nowrap">ชำระเงิน & สมัครแพ็กเกจ</h1>
          <p className="text-[10px] text-gray-400 leading-none mt-0.5 hidden sm:block">เลือกต่ออายุการใช้บริการ บัญชีร้านค้า หรือดูประวัติการทำธุรกรรม</p>
        </div>
      </div>

      {subscription && (
        <div style={{ background: "rgba(16,185,129,0.1)", border: "1px solid rgba(16,185,129,0.3)", borderRadius: "12px", padding: "16px", marginBottom: "20px" }}>
          <div className="flex items-center gap-2 mb-2">
            <span style={{ background: "#10b981", color: "#fff", padding: "2px 10px", borderRadius: "8px", fontSize: "11px", fontWeight: 700 }}>ACTIVE</span>
            <span className="text-gray-900 font-bold">{subscription.packages?.name || "Pro"}</span>
          </div>
          <div className="text-gray-500 text-xs">
            หมดอายุ: {new Date(subscription.current_period_end).toLocaleDateString("th-TH", { year: "numeric", month: "long", day: "numeric" })}
            {" • "}Gateway: {gwLabels[subscription.gateway] || subscription.gateway}
          </div>
        </div>
      )}

      <div className="flex gap-2 mb-5 overflow-x-auto pb-1 scrollbar-none">
        {["plans", "history"].map(t => (
          <button key={t} onClick={() => setTab(t)}
            className={"whitespace-nowrap px-3.5 py-2 rounded-xl text-xs font-bold transition border " + (tab === t ? "bg-blue-600 border-blue-600 text-white shadow-md shadow-blue-500/15" : "bg-white border-gray-200 text-slate-600 hover:bg-gray-50 hover:border-gray-300")}>
            {t === "plans" ? "📦 แพ็กเกจระบบ" : "📋 ประวัติชำระเงิน"}
          </button>
        ))}
      </div>

      {tab === "plans" && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: "16px" }}>
          {packages.map(pkg => (
            <div key={pkg.id} style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: "16px", padding: "20px", position: "relative" }}>
              {pkg.name?.toLowerCase() === "standard" && (
                <div style={{ position: "absolute", top: "-8px", right: "12px", background: "linear-gradient(135deg,#f59e0b,#ef4444)", color: "#fff", fontSize: "10px", fontWeight: 700, padding: "2px 10px", borderRadius: "8px" }}>ยอดนิยม</div>
              )}
              {pkg.name?.toLowerCase() === "enterprise" && (
                <div style={{ position: "absolute", top: "-8px", right: "12px", background: "linear-gradient(135deg,#8b5cf6,#c084fc)", color: "#fff", fontSize: "10px", fontWeight: 700, padding: "2px 10px", borderRadius: "8px" }}>แพ็กเกจสูงสุด</div>
              )}
              <div className="text-gray-900 font-bold text-lg mb-1">{pkg.name}</div>
              <div style={{ fontSize: "28px", fontWeight: 800, color: "#3b82f6", marginBottom: "8px" }}>฿{(pkg.price || 0).toLocaleString()}<span className="text-gray-400 text-sm font-normal">/เดือน</span></div>
              <div className="text-gray-500 text-xs mb-3">{pkg.description || ""}</div>
              <div className="text-gray-500 text-xs mb-4" style={{ lineHeight: "1.8" }}>
                ✅ {pkg.msg_limit === -1 ? "ไม่จำกัด" : (pkg.msg_limit || 0).toLocaleString()} ข้อความ/เดือน<br/>
                ✅ {pkg.product_limit === -1 ? "ไม่จำกัด" : (pkg.product_limit || 0).toLocaleString()} สินค้า<br/>
                {pkg.features?.ai && <span>✅ AI Chatbot (Agentic)<br/></span>}

                {pkg.features?.slip_check && <span>✅ ระบบตรวจสลิปอัตโนมัติ<br/></span>}

                {pkg.features?.analytics && <span>✅ ระบบวิเคราะห์ข้อมูล (Analytics)<br/></span>}
                {pkg.features?.custom_prompt && <span className="text-purple-600 font-semibold">✨ AI Prompt Generator<br/></span>}
                {pkg.features?.byok && <span className="text-purple-600 font-semibold">🔑 Unlimited AI (BYOK)<br/></span>}
                {pkg.features?.team_management && <span className="text-purple-600 font-semibold">👥 ระบบจัดการทีม (เร็วๆนี้)<br/></span>}
                {pkg.features?.erp_api && <span className="text-purple-600 font-semibold">🔌 เชื่อมต่อ ERP (เร็วๆนี้)<br/></span>}
              </div>
              <button onClick={() => { setSelectedPkg(pkg); setShowPayModal(true); }}
                disabled={pkg.price === 0}
                className="w-full py-2.5 rounded-lg text-sm font-bold transition"
                style={{ background: pkg.price === 0 ? "#e5e7eb" : "linear-gradient(135deg,#3b82f6,#6366f1)", color: pkg.price === 0 ? "#6b7280" : "#fff", border: "none", cursor: pkg.price === 0 ? "default" : "pointer" }}>
                {pkg.price === 0 ? "แพ็กเกจปัจจุบัน" : "เลือกแพ็กเกจนี้"}
              </button>
            </div>
          ))}
        </div>
      )}

      {tab === "history" && (
        <div style={{ overflowX: "auto" }}>
          {history.length === 0 ? (
            <div className="text-gray-400 text-center py-10">ยังไม่มีประวัติการชำระเงิน</div>

            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "13px" }}>
              <thead>
                <tr style={{ borderBottom: "1px solid #e5e7eb" }}>

                  <th style={{ textAlign: "left", padding: "8px", color: "#6b7280", fontWeight: 600 }}>แพ็กเกจ</th>
                  <th style={{ textAlign: "right", padding: "8px", color: "#6b7280", fontWeight: 600 }}>จำนวนเงิน</th>
                  <th style={{ textAlign: "center", padding: "8px", color: "#6b7280", fontWeight: 600 }}>ช่องทาง</th>
                  <th style={{ textAlign: "center", padding: "8px", color: "#6b7280", fontWeight: 600 }}>สถานะ</th>
                  <th style={{ textAlign: "left", padding: "8px", color: "#6b7280", fontWeight: 600 }}>วันที่</th>
                </tr>
              </thead>
              <tbody>
                {history.map(h => (
                  <tr key={h.id} style={{ borderBottom: "1px solid #f3f4f6" }}>
                    <td style={{ padding: "8px", color: "#111827", fontFamily: "monospace", fontSize: "11px" }}>{h.invoice_number || "-"}</td>
                    <td style={{ padding: "8px", color: "#111827" }}>{h.package_name}</td>
                    <td style={{ padding: "8px", color: "#3b82f6", textAlign: "right", fontWeight: 600 }}>฿{(h.amount || 0).toLocaleString()}</td>
                    <td style={{ padding: "8px", textAlign: "center", color: "#6b7280", fontSize: "11px" }}>{gwLabels[h.gateway] || gwLabels[h.payment_method] || h.gateway || "-"}</td>
                    <td style={{ padding: "8px", textAlign: "center" }}>
                      <span style={{ background: (statusColors[h.status] || "#64748b") + "20", color: statusColors[h.status] || "#64748b", padding: "2px 8px", borderRadius: "6px", fontSize: "11px", fontWeight: 600 }}>{statusLabels[h.status] || h.status}</span>
                    </td>
                    <td style={{ padding: "8px", color: "#6b7280", fontSize: "11px" }}>{h.paid_at ? new Date(h.paid_at).toLocaleDateString("th-TH") : new Date(h.created_at).toLocaleDateString("th-TH")}</td>

              </tbody>
            </table>
          )}
        </div>

      {showPayModal && selectedPkg && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: "16px" }}

          <div style={{ background: "#1e293b", border: "1px solid #e5e7eb", borderRadius: "16px", padding: "24px", maxWidth: "400px", width: "100%" }}
            onClick={e => e.stopPropagation()}>
            <h3 className="text-gray-900 font-bold text-lg mb-1">ชำระเงิน — {selectedPkg.name}</h3>
            <div style={{ fontSize: "24px", fontWeight: 800, color: "#3b82f6", marginBottom: "16px" }}>฿{(selectedPkg.price || 0).toLocaleString()}</div>

            <div className="text-gray-500 text-xs mb-4">เลือกช่องทางชำระเงิน:</div>

            <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
              {config?.gateways?.stripe?.enabled && (
                <button onClick={() => payStripe(selectedPkg.id)} disabled={paying}
                  style={{ padding: "12px", borderRadius: "10px", border: "1px solid rgba(99,102,241,0.4)", background: "rgba(99,102,241,0.1)", color: "#a5b4fc", fontWeight: 600, fontSize: "14px", cursor: paying ? "not-allowed" : "pointer", opacity: paying ? 0.5 : 1 }}>
                  💳 บัตรเครดิต / Debit (Stripe)
                  {config.gateways.stripe.testMode && <span style={{ marginLeft: "8px", fontSize: "10px", background: "#f59e0b", color: "#000", padding: "1px 6px", borderRadius: "4px" }}>TEST</span>}
                </button>
              )}
              {config?.gateways?.omise?.enabled && (
                <>
                  <button onClick={() => payOmise(selectedPkg.id, "promptpay")} disabled={paying}
                    style={{ padding: "12px", borderRadius: "10px", border: "1px solid rgba(16,185,129,0.4)", background: "rgba(16,185,129,0.1)", color: "#6ee7b7", fontWeight: 600, fontSize: "14px", cursor: paying ? "not-allowed" : "pointer", opacity: paying ? 0.5 : 1 }}>
                    📱 PromptPay QR (Omise)
                    {config.gateways.omise.testMode && <span style={{ marginLeft: "8px", fontSize: "10px", background: "#f59e0b", color: "#000", padding: "1px 6px", borderRadius: "4px" }}>TEST</span>}
                  </button>
                  <button onClick={() => payOmise(selectedPkg.id, "card")} disabled={paying}
                    style={{ padding: "12px", borderRadius: "10px", border: "1px solid rgba(59,130,246,0.4)", background: "rgba(59,130,246,0.1)", color: "#93c5fd", fontWeight: 600, fontSize: "14px", cursor: paying ? "not-allowed" : "pointer", opacity: paying ? 0.5 : 1 }}>
                    💳 บัตรเครดิต (Omise)
                    {config.gateways.omise.testMode && <span style={{ marginLeft: "8px", fontSize: "10px", background: "#f59e0b", color: "#000", padding: "1px 6px", borderRadius: "4px" }}>TEST</span>}
                  </button>
                </>
              )}
              <button onClick={() => payManual(selectedPkg.id, "bank_transfer")} disabled={paying}
                style={{ padding: "12px", borderRadius: "10px", border: "1px solid rgba(148,163,184,0.3)", background: "rgba(148,163,184,0.05)", color: "#cbd5e1", fontWeight: 600, fontSize: "14px", cursor: paying ? "not-allowed" : "pointer", opacity: paying ? 0.5 : 1 }}>
                🏦 โอนเงิน / พร้อมเพย์ (แจ้งชำระ)
              </button>

              {!config?.gateways?.stripe?.enabled && !config?.gateways?.omise?.enabled && (
                <div style={{ background: "rgba(245,158,11,0.1)", border: "1px solid rgba(245,158,11,0.3)", borderRadius: "8px", padding: "10px", color: "#fbbf24", fontSize: "11px", textAlign: "center" }}>

            <button onClick={() => setShowPayModal(false)} disabled={paying}

}

// ═══════════════════════════════════════════════════════════
//  SA PAYMENT PAGE (Super Admin — ดู/จัดการ payment ทั้งหมด)
// ═══════════════════════════════════════════════════════════
function SAPaymentPage({ toast }) {
  const [payments, setPayments] = useState([]);
  const [summary, setSummary] = useState({});
  const [gateways, setGateways] = useState({});
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("overview"); // overview | payments | events
  const [confirming, setConfirming] = useState(null);

  const load = async () => {
    setLoading(true);
    try {
      const [payR, evtR] = await Promise.all([
        api("/api/payment/admin/all"),
        api("/api/payment/admin/events"),
      ]);
      setPayments(payR.payments || []);
      setSummary(payR.summary || {});
      setGateways(payR.gateways || {});
      setEvents(evtR.events || []);
    } catch (e) { toast(e.message, "error"); }
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const confirmPayment = async (billingId) => {
    setConfirming(billingId);
    try {
      const r = await api(`/api/payment/confirm/${billingId}`, { method: "POST" });
      if (r.success) { toast(r.message, "success"); await load(); }
      else toast(r.error, "error");
    } catch (e) { toast(e.message, "error"); }
    setConfirming(null);
  };

  if (loading) return <Loader />;

  const statusColors = { paid: "#10b981", pending: "#f59e0b", pending_review: "#3b82f6", failed: "#ef4444", overdue: "#ef4444" };
  const statusLabels = { paid: "ชำระแล้ว", pending: "รอชำระ", pending_review: "รอตรวจสอบ", failed: "ไม่สำเร็จ", overdue: "เกินกำหนด" };

  const summaryCards = [
    { label: "รายได้รวม", value: `฿${(summary.total_revenue || 0).toLocaleString()}`, color: "#10b981", bg: "rgba(16,185,129,0.1)", icon: "💰" },
    { label: "รายได้เดือนนี้", value: `฿${(summary.month_revenue || 0).toLocaleString()}`, color: "#3b82f6", bg: "rgba(59,130,246,0.1)", icon: "📈" },
    { label: "ชำระแล้ว", value: summary.total_paid || 0, color: "#10b981", bg: "rgba(16,185,129,0.1)", icon: "✅" },
    { label: "รอตรวจสอบ", value: summary.pending_review || 0, color: "#f59e0b", bg: "rgba(245,158,11,0.1)", icon: "⏳" },
  ];

  return (
    <div>
      <h2 className="text-xl font-bold text-gray-900 mb-4">Payment Gateway Management</h2>

      {/* Gateway Status */}
      <div className="grid grid-cols-2 sm:flex sm:flex-wrap gap-2 sm:gap-3 mb-5">
        {Object.entries(gateways).map(([k, v]) => (
          <div key={k} style={{ background: v.enabled ? "rgba(16,185,129,0.1)" : "rgba(100,116,139,0.1)", border: `1px solid ${v.enabled ? "rgba(16,185,129,0.3)" : "#e5e7eb"}`, borderRadius: "8px", padding: "8px 12px", display: "flex", alignItems: "center", justifyContent: "center", gap: "6px" }}>
            <span style={{ width: "8px", height: "8px", borderRadius: "50%", background: v.enabled ? "#10b981" : "#64748b" }} />
            <span style={{ color: v.enabled ? "#059669" : "#475569", fontSize: "12px", fontWeight: 600, textTransform: "capitalize" }}>{k}</span>
            {v.testMode && <span style={{ fontSize: "9px", background: "#f59e0b", color: "#000", padding: "1px 5px", borderRadius: "3px", fontWeight: 700 }}>TEST</span>}
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div className="flex flex-wrap gap-2 mb-5">
        {[{ id: "overview", label: "📊 ภาพรวม" }, { id: "payments", label: "💳 รายการทั้งหมด" }, { id: "events", label: "📡 Webhook Events" }].map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={"flex-1 sm:flex-none whitespace-nowrap text-center px-2 py-2 sm:px-4 sm:py-2 rounded-lg text-[10px] sm:text-xs font-semibold transition border " + (tab === t.id ? "bg-blue-100 border-blue-500 text-blue-700" : "bg-gray-50 border-gray-300 text-gray-700")}>
            {t.label}
          </button>
        ))}
      </div>

      {tab === "overview" && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: "12px", marginBottom: "24px" }}>
          {summaryCards.map(c => (
            <div key={c.label} style={{ background: c.bg, border: `1px solid ${c.color}30`, borderRadius: "12px", padding: "16px" }}>
              <div style={{ fontSize: "24px", marginBottom: "4px" }}>{c.icon}</div>
              <div style={{ fontSize: "22px", fontWeight: 800, color: c.color }}>{c.value}</div>
              <div style={{ fontSize: "11px", color: "#6b7280" }}>{c.label}</div>
            </div>
          ))}
        </div>
      )}

      {(tab === "overview" || tab === "payments") && (
        <div style={{ overflowX: "auto" }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-gray-900 font-bold text-sm">{tab === "overview" ? "รายการล่าสุด (รอตรวจสอบ)" : "รายการทั้งหมด"}</h3>
            <button onClick={load} className="text-gray-500 hover:text-gray-900 text-xs flex items-center gap-1"><Icon d={Icons.refresh} size={14} /> รีเฟรช</button>
          </div>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "12px" }}>
            <thead>
              <tr style={{ borderBottom: "1px solid #e5e7eb" }}>
                <th style={{ textAlign: "left", padding: "8px", color: "#6b7280" }}>เลขที่</th>
                <th style={{ textAlign: "left", padding: "8px", color: "#6b7280" }}>ร้าน</th>
                <th style={{ textAlign: "left", padding: "8px", color: "#6b7280" }}>แพ็กเกจ</th>
                <th style={{ textAlign: "right", padding: "8px", color: "#6b7280" }}>เงิน</th>
                <th style={{ textAlign: "center", padding: "8px", color: "#6b7280" }}>Gateway</th>
                <th style={{ textAlign: "center", padding: "8px", color: "#6b7280" }}>สถานะ</th>
                <th style={{ textAlign: "center", padding: "8px", color: "#6b7280" }}>จัดการ</th>
              </tr>
            </thead>
            <tbody>
              {(tab === "overview" ? payments.filter(p => p.status === "pending_review" || p.status === "pending") : payments).slice(0, tab === "overview" ? 10 : 100).map(p => (
                <tr key={p.id} style={{ borderBottom: "1px solid rgba(51,65,85,0.2)" }}>
                  <td style={{ padding: "8px", color: "#111827", fontFamily: "monospace", fontSize: "10px" }}>{p.invoice_number || `#${p.id}`}</td>
                  <td style={{ padding: "8px", color: "#111827" }}>{p.shops?.name || "-"}</td>
                  <td style={{ padding: "8px", color: "#6b7280" }}>{p.package_name}</td>
                  <td style={{ padding: "8px", color: "#3b82f6", textAlign: "right", fontWeight: 600 }}>฿{(p.amount || 0).toLocaleString()}</td>
                  <td style={{ padding: "8px", textAlign: "center", color: "#6b7280", fontSize: "10px", textTransform: "capitalize" }}>{p.gateway || "-"}</td>
                  <td style={{ padding: "8px", textAlign: "center" }}>
                    <span style={{ background: (statusColors[p.status] || "#64748b") + "20", color: statusColors[p.status] || "#64748b", padding: "2px 8px", borderRadius: "6px", fontSize: "10px", fontWeight: 600 }}>{statusLabels[p.status] || p.status}</span>
                  </td>
                  <td style={{ padding: "8px", textAlign: "center" }}>
                    {(p.status === "pending_review" || p.status === "pending") && (
                      <button onClick={() => confirmPayment(p.id)} disabled={confirming === p.id}
                        style={{ background: "#10b981", color: "#fff", border: "none", padding: "4px 10px", borderRadius: "6px", fontSize: "11px", fontWeight: 600, cursor: "pointer", opacity: confirming === p.id ? 0.5 : 1 }}>
                        {confirming === p.id ? "..." : "✅ ยืนยัน"}
                      </button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          {payments.length === 0 && <div className="text-gray-400 text-center py-8 text-sm">ยังไม่มีรายการชำระเงิน</div>}
        </div>
      )}

      {tab === "events" && (
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "11px" }}>
            <thead>
              <tr style={{ borderBottom: "1px solid #e5e7eb" }}>
                <th style={{ textAlign: "left", padding: "6px", color: "#6b7280" }}>เวลา</th>
                <th style={{ textAlign: "left", padding: "6px", color: "#6b7280" }}>Gateway</th>
                <th style={{ textAlign: "left", padding: "6px", color: "#6b7280" }}>Event</th>
                <th style={{ textAlign: "left", padding: "6px", color: "#6b7280" }}>Event ID</th>
              </tr>
            </thead>
            <tbody>
              {events.map(ev => (
                <tr key={ev.id} style={{ borderBottom: "1px solid rgba(51,65,85,0.2)" }}>
                  <td style={{ padding: "6px", color: "#6b7280" }}>{new Date(ev.created_at).toLocaleString("th-TH")}</td>
                  <td style={{ padding: "6px", color: "#111827", textTransform: "capitalize" }}>{ev.gateway}</td>
                  <td style={{ padding: "6px", color: "#3b82f6", fontFamily: "monospace" }}>{ev.event_type}</td>
                  <td style={{ padding: "6px", color: "#64748b", fontFamily: "monospace", fontSize: "10px" }}>{(ev.event_id || "").slice(0, 24)}...</td>
                </tr>
              ))}
            </tbody>
          </table>
          {events.length === 0 && <div className="text-gray-400 text-center py-8 text-sm">ยังไม่มี webhook events</div>}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  Customer Management
// ═══════════════════════════════════════════════════════════
function CustomerManagementPage({ toast }) {
  const [customers, setCustomers] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [showModal, setShowModal] = React.useState(false);
  const [editId, setEditId] = React.useState(null);
  const [form, setForm] = React.useState({ name: "", phone: "", email: "", address: "", tax_id: "", line_id: "" });
  const [search, setSearch] = React.useState("");

  const loadData = async () => {
    setLoading(true);
    try {
      const res = await fetch("/api/customers", { headers: { Authorization: "Bearer " + localStorage.getItem("botify_token") }});
      const data = await res.json();
      setCustomers(data.customers || []);
    } catch (e) { toast("Error: " + e.message, "error"); }
    setLoading(false);
  };
  React.useEffect(() => { loadData(); }, []);

  const handleSave = async () => {
    if (!form.name) return toast("กรุณากรอกชื่อลูกค้า", "error");
    try {
      const url = editId ? `/api/customers/${editId}` : "/api/customers";
      const method = editId ? "PUT" : "POST";
      const res = await fetch(url, {
        method, headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem("botify_token") },
        body: JSON.stringify(form)
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      toast("บันทึกข้อมูลเรียบร้อย", "success");
      setShowModal(false);
      loadData();
    } catch (e) { toast(e.message, "error"); }
  };

  const filtered = customers.filter(c => 
    c.name.toLowerCase().includes(search.toLowerCase()) || 
    (c.phone && c.phone.includes(search)) ||
    (c.line_id && c.line_id.toLowerCase().includes(search.toLowerCase()))
  );

  return (
    <div className="w-full flex flex-col font-sans">
      {/* Header */}
      <div className="flex items-center justify-between gap-3 mb-6">
        <div className="flex flex-col">
          <h1 className="text-base md:text-xl font-black text-slate-900 leading-tight whitespace-nowrap">จัดการข้อมูลลูกค้า</h1>
          <p className="text-[10px] text-gray-400 leading-none mt-0.5 hidden sm:block">บันทึกประวัติ รายละเอียด และช่องทางการติดต่อของลูกค้าทั้งหมด</p>
        </div>
        <button onClick={() => { setEditId(null); setForm({ name: "", phone: "", email: "", address: "", tax_id: "", line_id: "" }); setShowModal(true); }}
          className="flex items-center justify-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl transition shadow-md shadow-blue-500/10">
          <Icon d={Icons.plus} size={14} /> เพิ่มลูกค้า
        </button>
      </div>

      {/* Search Bar */}
      <div className="relative mb-5">
        <div className="absolute left-3 top-2.5 text-gray-400"><Icon d={Icons.search} size={16} /></div>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="ค้นหาชื่อ, เบอร์โทร, LINE ID..."
          className="w-full bg-white border border-gray-200 rounded-xl pl-10 pr-4 py-2.5 text-gray-900 text-sm outline-none focus:border-blue-500 transition shadow-sm" />
      </div>

      {/* Table Container */}
      <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        {loading ? (
          <div className="p-10 text-center text-gray-400 font-bold">กำลังโหลด...</div>
        ) : filtered.length === 0 ? (

        >
          <div className="space-y-3.5">
            <Field label="ชื่อลูกค้า / บริษัท *" val={form.name} set={v => setForm({ ...form, name: v })} />

            <Field label="LINE ID" val={form.line_id} set={v => setForm({ ...form, line_id: v })} />

            <Field label="เลขประจำตัวผู้เสียภาษี" val={form.tax_id} set={v => setForm({ ...form, tax_id: v })} />
          </div>
        </Modal>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  DocumentsPage Component
// ═══════════════════════════════════════════════════════════
function DocumentsPage({ toast }) {
  const [tab, setTab] = React.useState("create"); // history, create
  const [docs, setDocs] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [saving, setSaving] = React.useState(false);
  const [storeSettings, setStoreSettings] = React.useState({});

  // Form State
  const [previewScale, setPreviewScale] = React.useState(0.6);
  React.useEffect(() => {
    const handleResize = () => {
      if (window.innerWidth < 500) setPreviewScale(0.42);
      else if (window.innerWidth < 768) setPreviewScale(0.5);
      else if (window.innerWidth < 1024) setPreviewScale(0.7);
      else setPreviewScale(0.6);
    };
    window.addEventListener('resize', handleResize);
    handleResize();
    return () => window.removeEventListener('resize', handleResize);
  }, []);

  const fdateTH = (d) => {
    if (!d) return "";
    const date = new Date(d);
    return `${date.getDate().toString().padStart(2, '0')}/${(date.getMonth() + 1).toString().padStart(2, '0')}/${date.getFullYear() + 543}`;
  };
  const fdateTHMedium = (d) => {
    if (!d) return "";
    const date = new Date(d);
    if (isNaN(date.getTime())) return "";
    return new Intl.DateTimeFormat("th-TH", { day: "numeric", month: "short", year: "numeric" }).format(date);
  };
  const issueDateRef = React.useRef(null);
  const dueDateRef = React.useRef(null);

  const generateDocNo = (prefix) => {
    const d = new Date();
    return `${prefix}${d.getFullYear().toString().slice(-2)}${(d.getMonth()+1).toString().padStart(2,'0')}${d.getDate().toString().padStart(2,'0')}-${Math.floor(Math.random()*1000).toString().padStart(3,'0')}`;
  };

  const getPrefix = (type) => {
    return { quotation: "QT", receipt: "RC", billing: "IV", delivery: "DL" }[type] || "DOC";
  };

  const [form, setForm] = React.useState({ 
    doc_type: "quotation", 
    doc_no: generateDocNo("QT"),
    issue_date: new Date().toISOString().split('T')[0],
    due_date: "",
    customer_id: "", 
    note: "ขอบคุณที่ไว้วางใจเลือกใช้บริการของเรา\nราคาดังกล่าวยังไม่รวมค่าจัดส่ง", 
    discount: 0, 
    taxRate: 0,
    signature: null
  });
  const [items, setItems] = React.useState([{ id: Date.now().toString(), name: "", price: 0, qty: 1 }]);
  const [customers, setCustomers] = React.useState([]);
  const [products, setProducts] = React.useState([]);

  // Search State
  const [customerSearchQuery, setCustomerSearchQuery] = React.useState("");
  const [showCustomerSearch, setShowCustomerSearch] = React.useState(false);
  const [activeItemSearchId, setActiveItemSearchId] = React.useState(null);
  const [productSearchQuery, setProductSearchQuery] = React.useState("");
  const fileInputRef = React.useRef(null);

  const loadData = async () => {
    setLoading(true);
    try {
      const headers = { Authorization: "Bearer " + localStorage.getItem("botify_token") };
      const [resDocs, resCust, resProd, resShopInfo] = await Promise.all([
        fetch("/api/documents", { headers }),
        fetch("/api/customers", { headers }),
        fetch("/api/products", { headers }),
        fetch("/api/shopinfo", { headers })
      ]);
      if(resDocs.ok) { const d = await resDocs.json(); setDocs(d.documents || []); }
      if(resCust.ok) { const d = await resCust.json(); setCustomers(d.customers || []); }
      if(resProd.ok) { const d = await resProd.json(); setProducts(d.products || []); }
      if(resShopInfo.ok) {
        const d = await resShopInfo.json();
        const info = d.info || {};
        setStoreSettings({
          shop_name: info.SHOP_NAME || "",
          address: info.ADDRESS || "",
          phone: info.PHONE || "",
          line_oa: info.LINE_OA || "",
          logo: info.LOGO || "",
          tax_id: info.TAX_ID || ""
        });
      }
    } catch(e){}
    setLoading(false);
  };

  React.useEffect(() => { loadData(); }, []);

  const handleDocTypeChange = (e) => {
    const type = e.target.value;
    setForm({ 
      ...form, 
      doc_type: type, 
      doc_no: generateDocNo(getPrefix(type)) 
    });
  };

  const calcTotals = () => {
    const subtotal = items.reduce((sum, it) => sum + (Number(it.price || 0) * Number(it.qty || 0)), 0);
    const afterDiscount = Math.max(0, subtotal - Number(form.discount || 0));
    const tax = (afterDiscount * Number(form.taxRate || 0)) / 100;
    const total = afterDiscount + tax;
    return { subtotal, afterDiscount, tax, total };
  };

  const handleSignatureUpload = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        setForm({ ...form, signature: ev.target.result });
      };
      reader.readAsDataURL(file);
    }
  };

  const handlePrint = () => {
    const printContent = document.getElementById("print-area").innerHTML;
    const printWindow = window.open('', '', 'width=900,height=900');
    printWindow.document.write(`
      <html>
        <head>
          <title>${form.doc_no} - ${storeSettings.shop_name || 'Document'}</title>
          <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;900&display=swap" rel="stylesheet">
          <style>
            @page { size: A4; margin: 0; }
            body { 
              margin: 0; 
              padding: 0;
              -webkit-print-color-adjust: exact; 
              print-color-adjust: exact; 
              background: #fff;
            }
            .print-container {
              width: 100%;
              transform: none !important;
              margin: 0 !important;
              box-shadow: none !important;
              border: none !important;
            }
          </style>
        </head>
        <body>
          <div class="print-container">
            ${printContent}
          </div>
          <script>
            window.onload = function() { 
              setTimeout(() => {
                window.print();
                window.close();
              }, 300);
            };
          <\/script>
        </body>
      </html>
    `);
    printWindow.document.close();
  };

  const handleSaveDoc = async (sendMethod) => {
    if (!form.customer_id) return toast("กรุณาเลือกลูกค้า", "error");
    if (items.some(i => !i.name)) return toast("กรุณาระบุชื่อสินค้าให้ครบ", "error");

    setSaving(true);
    const cus = customers.find(c => c.id === form.customer_id);
    const { subtotal, tax, total } = calcTotals();
    const payload = {
      doc_type: form.doc_type,
      doc_no: form.doc_no,
      customer_id: cus.id,
      customer_info: cus,
      items: items.map(it => ({ name: it.name, price: Number(it.price), qty: Number(it.qty) })),
      subtotal, discount: Number(form.discount), tax_rate: Number(form.taxRate), tax, total,
      note: form.note,
      status: sendMethod ? "sent" : "draft"
    };

    try {
      const res = await fetch("/api/documents", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem("botify_token") },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed");
      
      toast(sendMethod ? "บันทึกและส่งเอกสารสำเร็จ" : "บันทึกเอกสารเรียบร้อย", "success");
      
      if (sendMethod === 'line') {
         await sendDocToMethod(data.id, 'line', cus);
      } else if (sendMethod === 'email') {
         toast("ระบบส่งอีเมลกำลังอยู่ในช่วงพัฒนา", "success");
      }
      
      loadData();
    } catch (e) {
      toast(e.message, "error");
    }
    setSaving(false);
  };

  const sendDocToMethod = async (docId, method, cusInfo) => {
    try {
      const res = await fetch(`/api/documents/${docId}/send`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem("botify_token") },
        body: JSON.stringify({ method, customer: cusInfo })
      });
      if (!res.ok) throw new Error("ส่งไม่สำเร็จ");
      toast(`ส่งเอกสารทาง ${method.toUpperCase()} สำเร็จ`, "success");
    } catch(e) { toast(e.message, "error"); }
  };

  // derived state
  const selectedCustomer = customers.find(c => c.id === form.customer_id);
  const totals = calcTotals();

  // Search logic
  const filteredCustomers = customers.filter(c => 
    c.name.toLowerCase().includes(customerSearchQuery.toLowerCase()) || 
    (c.phone && c.phone.includes(customerSearchQuery))
  );

  const filteredProducts = products.filter(p => 
    p.name.toLowerCase().includes(productSearchQuery.toLowerCase())
  );

  return (
    <div className="w-full flex flex-col font-sans">

      {/* Header & Controls Container */}
      <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6 px-4 pt-4 md:px-6 md:pt-6 font-sans">
        <div className="flex flex-col">
          <h1 className="text-base md:text-xl font-black text-slate-900 leading-tight whitespace-nowrap">เอกสารการขาย</h1>
          <p className="text-[10px] text-gray-400 leading-none mt-0.5 hidden sm:block">สร้างและส่งใบเสนอราคา ใบแจ้งหนี้ หรือใบเสร็จอย่างมืออาชีพ</p>
        </div>

             <div className="sticky top-4">

                  <p className="text-sm font-bold text-gray-700 flex items-center gap-2">
                    <Icon d={Icons.eye} size={16} className="text-orange-500" />
                    ตัวอย่างเอกสาร ({form.doc_type === 'quotation' ? 'ใบเสนอราคา' : form.doc_type === 'receipt' ? 'ใบเสร็จ' : form.doc_type === 'billing' ? 'ใบแจ้งหนี้' : 'ใบส่งของ'})
                  </p>
                  <span className="text-[10px] font-bold text-slate-900 bg-gray-100 px-2.5 py-1 rounded-full border border-gray-200">A4 Size</span>
               </div>
               
               {/* The actual A4 Preview scaled down */}
               <div className="rounded-2xl shadow-lg border border-gray-200 bg-gray-300 overflow-hidden relative" style={{ height: 'min(800px, calc(100vh - 150px))' }}>
                 <div className="absolute inset-0 overflow-auto flex justify-center custom-scrollbar pb-10">
                   <div style={{ transform: `scale(${previewScale})`, transformOrigin: 'top center', marginTop: '20px', marginBottom: `-${(1 - previewScale) * 100}%` }}>
                     <div id="print-area">
                       <DocumentPreview 
                         storeSettings={storeSettings}
                         customer={selectedCustomer}
                         items={items}
                         docType={form.doc_type}
                         docNo={form.doc_no}
                         issueDate={form.issue_date}
                         dueDate={form.due_date}
                         subtotal={totals.subtotal}
                         discount={form.discount}
                         tax={totals.tax}
                         total={totals.total}
                         note={form.note}
                         signature={form.signature}
                       />
                     </div>
                   </div>
                 </div>
               </div>
             </div>
          </div>
        </div>
        </div>
      )}
    </div>
  );
}


// ═══════════════════════════════════════════════════════════
//  MAIN APP
// ═══════════════════════════════════════════════════════════
function App() {
  const [loggedIn, setLoggedIn] = useState(() => !!(sessionStorage.getItem("botify_token") || sessionStorage.getItem("botify_key")));
  const [page, setPage] = useState(() => getAuth().role === "superadmin" ? "sa_dashboard" : "stats");
  const [toastData, setToastData] = useState(null);
  const [sideOpen, setSideOpen] = useState(false);
  const [currentShop, setCurrentShop] = useState("all");
  const [showOnboarding, setShowOnboarding] = useState(false);
  const [onboardingChecked, setOnboardingChecked] = useState(false);

  const auth = getAuth();
  const isSuperAdmin = auth.role === "superadmin";
  const [emailVerified, setEmailVerified] = useState(true);
  const [sendingVerify, setSendingVerify] = useState(false);

  const PAGES = isSuperAdmin ? SA_PAGES : BASE_PAGES;

  // เช็ค email verification status
  useEffect(() => {
    if (loggedIn && !isSuperAdmin) {
      api("/api/auth/email-status").then(r => {
        if (r.success && r.verified === false) setEmailVerified(false);
      }).catch(() => {});
    }
  }, [loggedIn]);

  // เช็ค onboarding status เมื่อ login
  // ⚠️ ปิดชั่วคราว — เปิดใช้ได้เมื่อต้องการทดสอบ onboarding flow
  useEffect(() => {
    setOnboardingChecked(true);
    // if (loggedIn && !isSuperAdmin && !onboardingChecked) {
    //   api("/api/onboarding").then(res => {
    //     if (!res.completed) setShowOnboarding(true);
    //     setOnboardingChecked(true);
    //   }).catch(() => setOnboardingChecked(true));
    // } else {
    //   setOnboardingChecked(true);
    // }
  }, [loggedIn]);

  // เริ่ม auto-refresh เมื่อเปิดหน้า + resume เมื่อกลับมาจาก tab อื่น
  useEffect(() => {
    if (loggedIn && sessionStorage.getItem("botify_token")) {
      TokenManager.startAutoRefresh();
      // เมื่อกลับมาจาก tab อื่น ให้เช็ค token
      const onVisibility = () => {
        if (document.visibilityState === "visible" && sessionStorage.getItem("botify_token")) {
          const expiresAt = Number(sessionStorage.getItem("botify_expires_at") || 0);
          const now = Math.floor(Date.now() / 1000);
          if (expiresAt && now > expiresAt - 60) {
            // token ใกล้หมดหรือหมดแล้ว → refresh ทันที
            TokenManager.refresh().then(res => {
              if (!res) { sessionStorage.clear(); setLoggedIn(false); }
            });
          }
        }
      };
      document.addEventListener("visibilitychange", onVisibility);
      return () => {
        document.removeEventListener("visibilitychange", onVisibility);
        TokenManager.stopAutoRefresh();
      };
    }
  }, [loggedIn]);

  const toast = (msg, type) => setToastData({ msg, type });
  const logout = () => {
    TokenManager.stopAutoRefresh();
    api("/api/auth/logout", { method: "POST" }).catch(() => {});
    sessionStorage.clear();
    setLoggedIn(false);
  };

  if (!loggedIn) return <LoginScreen onLogin={() => setLoggedIn(true)} />;
  if (showOnboarding) return <OnboardingWizard onComplete={() => setShowOnboarding(false)} />;

  const renderPage = () => {
    if (isSuperAdmin) {
      switch (page) {
        case "sa_dashboard": return <SADashboardPage />;
        case "shops": return <ShopManagementPage toast={toast} />;
        case "users": return <UserManagementPage toast={toast} />;
        case "ai_management": return <AIManagementPage toast={toast} />;
        case "packages": return <PackageManagementPage toast={toast} />;
        case "billing": return <BillingPage toast={toast} />;
        case "sa_payments": return <SAPaymentPage toast={toast} />;
        case "broadcast": return <BroadcastPage toast={toast} />;
        case "logs": return <ActivityLogPage />;
        default: return <SADashboardPage />;
      }
    }
    switch (page) {
      case "stats": return <StatsPage onNavigate={setPage} />;
      case "shop": return <ShopSettings toast={toast} />;
      case "bot": return <BotConfig toast={toast} />;
      case "products": return <ProductsPage toast={toast} />;
      case "documents": return <DocumentsPage toast={toast} />;
      case "customers": return <CustomerManagementPage toast={toast} />;
      case "orders": return <OrdersPage toast={toast} />;
      case "promos": return <PromotionsPage toast={toast} />;
      case "bookings": return <BookingsPage toast={toast} />;
      case "channels": return <ChannelSettingsPage toast={toast} />;
      case "notifications": return <NotificationSettingsPage toast={toast} />;
      case "chats": return <ChatHistoryPage toast={toast} />;
      case "payment": return <PaymentPage toast={toast} />;
      default: return <StatsPage onNavigate={setPage} />;
    }
  };

  return (
    <div style={{ height: "100vh", background: "#f3f4f6", display: "flex", overflow: "hidden" }}>
      {toastData && <Toast msg={toastData.msg} type={toastData.type} onClose={() => setToastData(null)} />}

      {/* Mobile overlay */}
      {sideOpen && <div className="lg:hidden fixed inset-0 bg-black/60 z-30" onClick={() => setSideOpen(false)} />}

      {/* ── Clean Light Sidebar (reference style) ── */}
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { box-sizing: border-box; }
        .lsb { width: 220px; min-width: 220px; background: #fff; border-right: 1px solid #e5e7eb;
               display: flex; flex-direction: column; font-family: 'Inter', sans-serif; height: 100vh; }
        .lsb-logo { padding: 20px 20px 16px; border-bottom: 1px solid #f3f4f6;
                    font-size: 18px; font-weight: 900; color: #111827; letter-spacing: -0.5px; flex-shrink: 0; }
        .lsb-logo span { color: #f59e0b; }
        .lsb-nav { flex: 1; padding: 12px 12px 8px; overflow-y: auto; min-height: 0; }
        .lsb-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px;
                   border: none; background: transparent; border-radius: 8px; cursor: pointer;
                   font-size: 13.5px; font-weight: 500; color: #6b7280; transition: all 0.15s;
                   text-align: left; font-family: 'Inter', sans-serif; }
        .lsb-btn:hover { background: #f9fafb; color: #111827; }
        .lsb-btn.act { background: #f3f4f6; color: #111827; font-weight: 600; }
        .lsb-btn svg { flex-shrink: 0; opacity: 0.7; }
        .lsb-btn.act svg { opacity: 1; }
        .lsb-sep { height: 1px; background: #f3f4f6; margin: 8px 12px; }
        .lsb-footer { padding: 12px 16px 16px; border-top: 1px solid #f3f4f6;
                      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
                      position: sticky; bottom: 0; background: #fff; }
        .lsb-avatar { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
                      background: linear-gradient(135deg,#3b82f6,#8b5cf6);
                      display: flex; align-items: center; justify-content: center;
                      font-size: 13px; font-weight: 800; color: #fff; }
        .lsb-name { font-size: 12.5px; font-weight: 600; color: #111827; line-height: 1.2; }
        .lsb-role { font-size: 11px; color: #9ca3af; }
      `}</style>

      <aside className={"lsb fixed lg:static inset-y-0 left-0 z-40 transition-transform lg:translate-x-0 " + (sideOpen ? "translate-x-0" : "-translate-x-full")}>
        {/* Logo */}
        <div className="lsb-logo">BOT<span>IFY</span></div>

        {/* Main Nav */}
        <nav className="lsb-nav">
          {(isSuperAdmin ? SA_PAGES : [
            { id: "stats",    label: "Overview",      icon: Icons.home },
            { id: "shop",     label: "ข้อมูลร้าน",  icon: Icons.settings },
            { id: "bot",      label: "ตั้งค่า Bot",  icon: Icons.bot },
            { id: "products", label: "สินค้า",       icon: Icons.box },
            { id: "documents", label: "เอกสารการขาย", icon: Icons.fileText },
            { id: "customers", label: "จัดการลูกค้า", icon: Icons.users },
            { id: "orders",   label: "ออเดอร์",       icon: Icons.cart },
            { id: "promos",   label: "โปรโมชั่น",    icon: Icons.tag },
          ]).map(p => (
            <button key={p.id} onClick={() => { setPage(p.id); setSideOpen(false); }}
              className={"lsb-btn" + (page === p.id ? " act" : "")}>
              <Icon d={p.icon} size={16} />
              {p.label}
            </button>
          ))}

          <div className="lsb-sep" />

          {!isSuperAdmin && [
            { id: "bookings",      label: "นัดหมาย",       icon: Icons.calendar },
            { id: "channels",      label: "เชื่อมต่อ",     icon: Icons.link },
            { id: "notifications", label: "แจ้งเตือน",     icon: Icons.bell },
            { id: "chats",         label: "ประวัติแชท",    icon: Icons.chat },
            { id: "payment",       label: "ชำระเงิน",       icon: Icons.creditCard },
          ].map(p => (
            <button key={p.id} onClick={() => { setPage(p.id); setSideOpen(false); }}
              className={"lsb-btn" + (page === p.id ? " act" : "")}>
              <Icon d={p.icon} size={16} />
              {p.label}
            </button>
          ))}
        </nav>

        {/* Footer - logout */}
        <div className="lsb-footer" style={{ justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
            <div className="lsb-avatar">
              {(() => {
                const name = auth.displayName || auth.username || auth.email || "US";
                if (name.includes("@")) {
                  const parts = name.split("@")[0];
                  return parts.length >= 2 ? parts.substring(0, 2).toUpperCase() : parts.toUpperCase();
                }
                const words = name.trim().split(/\s+/);
                if (words.length >= 2) {
                  return (words[0][0] + words[1][0]).toUpperCase();
                }
                return name.length >= 2 ? name.substring(0, 2).toUpperCase() : name.toUpperCase();
              })()}
            </div>
          </div>
          <button onClick={logout} style={{ background: "none", border: "none", cursor: "pointer", color: "#9ca3af", padding: "4px" }} title="ออกจากระบบ">
            <Icon d={Icons.logout} size={16} />
          </button>
        </div>
      </aside>


      <main className="flex-1 min-w-0" style={{ overflow: "auto", background: "#f3f4f6" }}>
        {/* Mobile topbar */}
        <div className="lg:hidden" style={{ background: "#fff", borderBottom: "1px solid #e5e7eb", padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <button onClick={() => setSideOpen(true)} style={{ background: "none", border: "none", cursor: "pointer", color: "#374151" }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12h18M3 6h18M3 18h18" /></svg>
          </button>
          <div style={{ fontSize: "15px", fontWeight: 900, color: "#111827", letterSpacing: "-0.3px" }}>BOT<span style={{ color: "#f59e0b" }}>IFY</span></div>
          <div style={{ width: 22 }} />
        </div>

        <div style={{ padding: "24px 28px" }}>
          {!emailVerified && !isSuperAdmin && (
            <div style={{ background: "rgba(245,158,11,0.1)", border: "1px solid rgba(245,158,11,0.3)", borderRadius: "12px", padding: "12px 16px", marginBottom: "16px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: "8px" }}>
              <div style={{ color: "#fbbf24", fontSize: "13px" }}>
                ⚠️ อีเมลของคุณยังไม่ได้รับการยืนยัน กรุณายืนยันเพื่อใช้งานเต็มรูปแบบ
              </div>
              <button onClick={async () => {
                setSendingVerify(true);
                try {
                  const email = sessionStorage.getItem("botify_email");
                  const r = await api("/api/auth/send-verification", { method: "POST", body: JSON.stringify({ email }) });
                  if (r.success) toast(r.message || "ส่งลิงก์ยืนยันแล้ว", "ok");
                  else toast(r.error || "ส่งไม่สำเร็จ", "error");
                } catch (e) { toast(e.message, "error"); }
                setSendingVerify(false);
              }} disabled={sendingVerify}
                style={{ background: "#f59e0b", color: "#000", border: "none", padding: "6px 14px", borderRadius: "8px", fontSize: "12px", fontWeight: 700, cursor: "pointer", opacity: sendingVerify ? 0.5 : 1, whiteSpace: "nowrap" }}>
                {sendingVerify ? "กำลังส่ง..." : "📧 ส่งลิงก์ยืนยัน"}
              </button>
            </div>
          )}
          {renderPage()}
        </div>

        <div style={{ padding: "16px 24px", borderTop: "1px solid #e5e7eb", textAlign: "center", fontSize: "11px", color: "#64748b" }}>
          © {new Date().getFullYear()} BOTIFY —
          <a href="/terms" target="_blank" style={{ color: "#6b7280", textDecoration: "none" }}>ข้อกำหนดการใช้งาน</a>
          {" • "}
          <a href="/privacy" target="_blank" style={{ color: "#6b7280", textDecoration: "none" }}>นโยบายความเป็นส่วนตัว</a>
        </div>
      </main>
    </div>
  );
}

root.render(React.createElement(App));
  </script>
